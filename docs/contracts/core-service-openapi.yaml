          format: int32
          description: "Абсолютное минимальное число игроков для матча"
          example: 10
        maxPlayers:
          type: integer
          format: int32
          description: "Абсолютное максимальное число игроков для матча"
          example: 22
        iconUrl:
          type: string
          description: "Необязательный URL значка вида спорта; может быть null"
    ActivityRequestFeedDto:
      type: object
