openapi: 3.1.0
info:
  title: "Определение OpenAPI"
  version: v0
servers:
- url: http://localhost:8081
  description: "Сгенерированный URL сервера"
tags:
- name: "Заявки на игры"
  description: "Создание заявок, управление участниками и регистрацией, запуск матчей"
- name: "Виды спорта"
  description: "Просмотр доступных видов спорта и ограничений числа игроков для заявок"
- name: "Результаты раундов"
  description: "Результаты раундов, отправленные организатором, и завершение заявки"
paths:
  /requests/{id}:
    get:
      tags:
      - "Заявки на игры"
      summary: "Получить подробности заявки"
      description: "Возвращает заявку, текущее состояние регистрации и список участников."
      operationId: getRequestDetails
      parameters:
      - name: id
        in: path
        description: "UUID заявки"
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: "Подробности заявки успешно получены"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActivityRequestDetailsDto"
        "400":
          description: "Некорректный UUID заявки"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Заявка не найдена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - "Заявки на игры"
      summary: "Изменить заявку на игру"
      description: "Организатор изменяет запланированную заявку. Новая вместимость должна учитывать текущих участников и оставаться в пределах ограничений вида спорта."
      operationId: updateRequest
      parameters:
      - name: id
        in: path
        description: "UUID заявки"
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: "UUID вызывающего пользователя. Core Service сейчас не аутентифицирует этот заголовок."
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityRequestDto"
        required: true
      responses:
        "200":
          description: "Обновлённые подробности заявки"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActivityRequestDetailsDto"
        "400":
          description: "Некорректные данные заявки или вместимость вне ограничений вида спорта"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Вызывающий пользователь не является организатором"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Заявка не найдена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Заявка не запланирована или вместимость меньше числа присоединившихся игроков"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests:
    get:
      tags:
      - "Заявки на игры"
      summary: "Поиск заявок по местоположению"
      description: "Возвращает будущие запланированные заявки с открытой регистрацией в радиусе поиска, упорядоченные по расстоянию. Фильтры вида спорта и даты необязательны."
      operationId: searchNearbyRequests
      parameters:
      - name: lat
        in: query
        description: "Широта"
        required: true
        schema:
          type: number
          format: double
          maximum: 90.0
          minimum: -90.0
        example: 55.7558
      - name: lon
        in: query
        description: "Долгота"
        required: true
        schema:
          type: number
          format: double
          maximum: 180.0
          minimum: -180.0
        example: 37.6173
      - name: radius
        in: query
        description: "Радиус поиска в метрах"
        required: false
        schema:
          type: number
          format: double
          default: 5000.0
          exclusiveMinimum: 0
        example: 5000
      - name: sportId
        in: query
        description: "Фильтр по виду спорта (необязательный)"
        required: false
        schema:
          type: integer
          format: int64
        example: 1
      - name: startDate
        in: query
        description: "Начало временного интервала (ISO-8601)"
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-09-10T10:00:00Z
      - name: endDate
        in: query
        description: "Конец временного интервала (ISO-8601)"
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-09-12T22:00:00Z
      responses:
        "200":
          description: "Заявки поблизости; список может быть пустым"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityRequestFeedDto"
        "400":
          description: "Некорректные координаты, радиус или диапазон дат"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - "Заявки на игры"
      summary: "Создать заявку на игру"
      description: "Создаёт запланированную заявку и добавляет её организатора первым принятым участником. Лимит игроков должен быть в пределах ограничений выбранного вида спорта."
      operationId: createRequest
      parameters:
      - name: X-User-Id
        in: header
        description: "UUID вызывающего пользователя. Core Service сейчас не аутентифицирует этот заголовок."
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequestDto"
        required: true
      responses:
        "201":
          description: "Заявка создана; ответ содержит requestId"
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
                  format: uuid
        "400":
          description: "Некорректные данные заявки или лимит игроков"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Вид спорта не найден"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{requestId}/rounds/{roundNumber}/result:
    post:
      tags:
      - "Результаты раундов"
      summary: "Записать результат раунда"
      description: "Организатор записывает непустые группы победителей и проигравших одинакового размера из принятых участников. Результат раунда неизменяем и может быть записан только пока заявка активна. Core Service не рассчитывает рейтинг."
      operationId: recordRoundResult
      parameters:
      - name: requestId
        in: path
        description: "UUID заявки"
        required: true
        schema:
          type: string
          format: uuid
      - name: roundNumber
        in: path
        description: "Номер раунда, начиная с 1"
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      - name: X-User-Id
        in: header
        description: "UUID вызывающего пользователя. Core Service сейчас не аутентифицирует этот заголовок."
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordRoundResultRequestDto"
        required: true
      responses:
        "201":
          description: "Результат раунда записан"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoundResultResponseDto"
        "400":
          description: "Некорректный номер раунда или выбор игроков"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Вызывающий пользователь не является организатором"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Заявка не найдена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Заявка не активна или результат этого раунда уже есть"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{requestId}/complete:
    post:
      tags:
      - "Результаты раундов"
      summary: "Завершить заявку"
      description: "Организатор завершает активную заявку после записи результатов всех запланированных раундов."
      operationId: completeRequest
      parameters:
      - name: requestId
        in: path
        description: "UUID заявки"
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: "UUID вызывающего пользователя. Core Service сейчас не аутентифицирует этот заголовок."
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: "Заявка завершена"
        "400":
          description: "Некорректный UUID заявки или вызывающего пользователя"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Вызывающий пользователь не является организатором"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Заявка не найдена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Заявка не активна или для некоторых раундов нет результата"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/start:
    post:
      tags:
      - "Заявки на игры"
      summary: "Запустить заявку"
      description: "Организатор запускает запланированную заявку после присоединения минимального для вида спорта числа игроков. Регистрация закрывается автоматически."
      operationId: startRequest
      parameters:
      - name: id
        in: path
        description: "UUID заявки"
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: "UUID вызывающего пользователя. Core Service сейчас не аутентифицирует этот заголовок."
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: "Заявка запущена"
        "400":
          description: "Некорректный UUID заявки или вызывающего пользователя"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Вызывающий пользователь не является организатором"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Заявка не найдена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Заявка не запланирована или игроков слишком мало"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/registration/open:
    post:
      tags:
      - "Заявки на игры"
      summary: "Открыть регистрацию"
      description: "Организатор повторно открывает регистрацию игроков в запланированной заявке."
      operationId: openRegistration
      parameters:
      - name: id
        in: path
        description: "UUID заявки"
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: "UUID вызывающего пользователя. Core Service сейчас не аутентифицирует этот заголовок."
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: "Регистрация открыта"
        "400":
          description: "Некорректный UUID заявки или вызывающего пользователя"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Вызывающий пользователь не является организатором"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Заявка не найдена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Заявка не запланирована"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/registration/close:
    post:
      tags:
      - "Заявки на игры"
      summary: "Закрыть регистрацию"
      description: "Организатор прекращает приём новых игроков, пока заявка остаётся запланированной. Существующие участники остаются в заявке."
      operationId: closeRegistration
      parameters:
      - name: id
        in: path
        description: "UUID заявки"
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: "UUID вызывающего пользователя. Core Service сейчас не аутентифицирует этот заголовок."
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: "Регистрация закрыта"
        "400":
          description: "Некорректный UUID заявки или вызывающего пользователя"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Вызывающий пользователь не является организатором"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Заявка не найдена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Заявка не запланирована"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/leave:
    post:
      tags:
      - "Заявки на игры"
      summary: "Покинуть заявку"
      description: "Принятый игрок покидает запланированную заявку, освобождая место. Организатор не может покинуть заявку."
      operationId: leaveRequest
      parameters:
      - name: id
        in: path
        description: "UUID заявки"
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: X-User-Id
        in: header
        description: "UUID вызывающего пользователя. Core Service сейчас не аутентифицирует этот заголовок."
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Игрок покинул заявку"
        "400":
          description: "Некорректный UUID заявки или вызывающего пользователя"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Заявка или участник не найдены"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Заявка не запланирована или игрок не может её покинуть"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/kick/{targetUserId}:
    post:
      tags:
      - "Заявки на игры"
      summary: "Исключить участника"
      description: "Организатор исключает принятого игрока из запланированной заявки. Игрок не может повторно присоединиться к этой заявке."
      operationId: kickParticipant
      parameters:
      - name: id
        in: path
        description: "UUID заявки"
        required: true
        schema:
          type: string
          format: uuid
      - name: targetUserId
        in: path
        description: "UUID исключаемого пользователя"
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: "UUID вызывающего пользователя. Core Service сейчас не аутентифицирует этот заголовок."
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Игрок исключён"
        "400":
          description: "Организатор попытался исключить себя"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Вызывающий пользователь не является организатором"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Заявка или игрок не найдены"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Заявка не запланирована или игрок уже ушёл либо был исключён"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/join:
    post:
      tags:
      - "Заявки на игры"
      summary: "Присоединиться к заявке"
      description: "Присоединение к запланированной заявке при открытой регистрации и наличии мест. Ушедший игрок может присоединиться повторно; исключённый — не может."
      operationId: joinRequest
      parameters:
      - name: id
        in: path
        description: "UUID заявки"
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: X-User-Id
        in: header
        description: "UUID вызывающего пользователя. Core Service сейчас не аутентифицирует этот заголовок."
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Игрок присоединился"
        "400":
          description: "Некорректные данные запроса"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Заявка не найдена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Регистрация закрыта, мест нет, игрок уже присоединился или был исключён"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/cancel:
    post:
      tags:
      - "Заявки на игры"
      summary: "Отменить заявку на игру"
      description: "Только организатор может отменить запланированную заявку. Активную или завершённую заявку отменить нельзя."
      operationId: cancelRequest
      parameters:
      - name: id
        in: path
        description: "UUID заявки"
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: "UUID вызывающего пользователя. Core Service сейчас не аутентифицирует этот заголовок."
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Заявка отменена"
        "400":
          description: "Некорректный UUID заявки или вызывающего пользователя"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Вызывающий пользователь не является организатором"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Заявка не найдена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Заявка не запланирована"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /sports:
    get:
      tags:
      - "Виды спорта"
      summary: "Получить список доступных видов спорта"
      description: "Возвращает виды спорта с минимальным и максимальным числом игроков."
      operationId: getAllSports
      responses:
        "200":
          description: "Доступные виды спорта; список может быть пустым"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SportDto"
  /requests/{requestId}/rounds:
    get:
      tags:
      - "Результаты раундов"
      summary: "Получить список записанных результатов раундов"
      description: "Возвращает все записанные результаты раундов заявки, упорядоченные по номеру раунда."
      operationId: getRoundResults
      parameters:
      - name: requestId
        in: path
        description: "UUID заявки"
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Записанные результаты; список может быть пустым"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoundResultResponseDto"
        "400":
          description: "Некорректный UUID заявки"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Заявка не найдена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    UpdateActivityRequestDto:
      type: object
      description: "Данные для изменения существующей заявки на игру"
      properties:
        title:
          type: string
          description: "Обновлённое название"
          example: Friendly football match - new time
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: "Обновлённое описание"
          example: Meeting at the GUK (3rd building)
        eventDate:
          type: string
          format: date-time
          description: "Обновлённые дата и время события (должны быть в будущем)"
          example: 2030-06-16T19:00:00Z
        numberOfRounds:
          type: integer
          format: int32
          description: "Обновлённое число раундов"
          example: 3
          maximum: 10
          minimum: 1
        maxPlayers:
          type: integer
          format: int32
          description: "Обновлённое максимальное число игроков"
          example: 12
          minimum: 2
      required:
      - eventDate
      - maxPlayers
      - numberOfRounds
      - title
    ApiError:
      type: object
      description: "Ошибка, возвращаемая API Core Service"
      properties:
        code:
          type: string
          description: "Стабильная машиночитаемая категория ошибки"
          example: VALIDATION_ERROR
        message:
          type: string
          description: "Объяснение для человека"
          example: Request body validation failed
        details:
          type: object
          additionalProperties:
            type: string
          description: "Ошибки проверки полей или параметров; пусто для других ошибок"
    ActivityRequestDetailsDto:
      type: object
      description: "Подробные сведения о комнате заявки"
      properties:
        id:
          type: string
          format: uuid
          description: "Уникальный ID заявки"
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: "Название заявки"
          example: Friendly football match
        description:
          type: string
          description: "Описание"
          example: "Outdoor match, bring your own boots"
        sportName:
          type: string
          description: "Название вида спорта"
          example: Football
        maxPlayers:
          type: integer
          format: int32
          description: "Максимальное число игроков"
          example: 10
        currentPlayers:
          type: integer
          format: int32
          description: "Текущее число принятых игроков"
          example: 4
        eventDate:
          type: string
          format: date-time
          description: "Дата и время начала события"
          example: 2030-06-15T18:00:00Z
        addressText:
          type: string
          description: "Текстовый адрес для отображения в карточке"
          example: "Москва, ул. Константина Царева, 12к1"
        numberOfRounds:
          type: integer
          format: int32
          description: "Запланированное число раундов/сетов"
          example: 3
        latitude:
          type: number
          format: double
          description: "Широта (для отметки на карте)"
          example: 55.715551
        longitude:
          type: number
          format: double
          description: "Долгота (для отметки на карте)"
          example: 37.554191
        status:
          type: string
          description: "Текущий статус жизненного цикла заявки"
          enum:
          - PLANNED
          - ACTIVE
          - CONFIRMATION
          - COMPLETED
          - CANCELLED
          - FROZEN
          example: PLANNED
        registrationOpen:
          type: boolean
          description: "Могут ли новые игроки присоединиться к заявке"
          example: false
        organizerId:
          type: string
          format: uuid
          description: "UUID организатора заявки"
          example: 123e4567-e89b-12d3-a456-426614174002
        participants:
          type: array
          description: "Список всех участников комнаты"
          items:
            $ref: "#/components/schemas/ParticipantDto"
    ParticipantDto:
      type: object
      description: "Сведения о конкретном участнике заявки на игру"
      properties:
        userId:
          type: string
          format: uuid
          description: "Уникальный идентификатор пользователя (для ссылки на его публичный профиль)"
          example: 123e4567-e89b-12d3-a456-426614174000
        role:
          type: string
          description: "Роль пользователя в этой заявке"
          enum:
          - ORGANIZER
          - PLAYER
          example: PLAYER
        status:
          type: string
          description: "Текущий статус участия"
          enum:
          - PENDING
          - ACCEPTED
          - KICKED
          - LEFT
          example: ACCEPTED
        joinedAt:
          type: string
          format: date-time
          description: "Время присоединения пользователя к заявке"
          example: 2026-09-03T12:00:00Z
    CreateActivityRequestDto:
      type: object
      description: "Данные для создания новой заявки"
      properties:
        title:
          type: string
          description: "Название игры"
          example: Friendly football match
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: "Описание игры"
          example: "Outdoor match, bring your own boots"
          maxLength: 500
          minLength: 0
        sportId:
          type: integer
          format: int64
          description: "ID вида спорта (из /sports)"
          example: 2
        maxPlayers:
          type: integer
          format: int32
          description: "Максимальное число игроков (задаётся организатором)"
          example: 20
        eventDate:
          type: string
          format: date-time
          description: "Будущие дата и время события"
          example: 2030-06-15T18:00:00Z
        numberOfRounds:
          type: integer
          format: int32
          description: "Число раундов для записи, от 1 до 10"
          example: 3
          maximum: 10
          minimum: 1
        addressText:
          type: string
          description: "Адрес игры"
          example: "г. Москва, ул. Константина Царева, 12к1"
          minLength: 1
        latitude:
          type: number
          format: double
          description: "Широта места проведения игры"
          example: 55.7558
          maximum: 90.0
          minimum: -90.0
        longitude:
          type: number
          format: double
          description: "Долгота места проведения игры"
          example: 37.6173
          maximum: 180.0
          minimum: -180.0
      required:
      - addressText
      - eventDate
      - latitude
      - longitude
      - maxPlayers
      - numberOfRounds
      - sportId
      - title
    RecordRoundResultRequestDto:
      type: object
      description: "Принятые участники, выигравшие или проигравшие один раунд. Оба списка должны быть непустыми, не пересекаться и иметь одинаковый размер."
      properties:
        winners:
          type: array
          description: "UUID победителей раунда; каждый игрок может встречаться только один раз"
          items:
            type: string
            format: uuid
          minItems: 1
        losers:
          type: array
          description: "UUID проигравших в раунде; каждый игрок может встречаться только один раз"
          items:
            type: string
            format: uuid
          minItems: 1
      required:
      - losers
      - winners
    RoundResultResponseDto:
      type: object
      description: "Неизменяемый результат одного раунда заявки на игру"
      properties:
        id:
          type: string
          format: uuid
          description: "UUID результата раунда"
          example: 123e4567-e89b-12d3-a456-426614174000
        requestId:
          type: string
          format: uuid
          description: "UUID заявки на игру"
          example: 123e4567-e89b-12d3-a456-426614174001
        roundNumber:
          type: integer
          format: int32
          description: "Номер раунда в заявке, начиная с 1"
          example: 1
        winners:
          type: array
          description: "UUID игроков, выигравших этот раунд"
          items:
            type: string
            format: uuid
        losers:
          type: array
          description: "UUID игроков, проигравших этот раунд"
          items:
            type: string
            format: uuid
        recordedBy:
          type: string
          format: uuid
          description: "UUID организатора, записавшего результат"
          example: 123e4567-e89b-12d3-a456-426614174002
        createdAt:
          type: string
          format: date-time
          description: "Время записи результата"
          example: 2030-06-15T18:30:00Z
    SportDto:
      type: object
      description: "DTO категории вида спорта, доступной в системе"
      properties:
        id:
          type: integer
          format: int64
          description: "Уникальный идентификатор вида спорта"
          example: 1
        name:
          type: string
          description: "Отображаемое название вида спорта"
          example: Football
        minPlayers:
