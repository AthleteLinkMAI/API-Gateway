openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8082/api/v1
  description: Generated server url
tags:
- name: Activity requests
  description: "Create requests, manage participants and registration, and start matches"
- name: Round submissions and completion
  description: Game Service stores and scores round results asynchronously
- name: Sports
  description: Read the sport catalog and whether each sport accepts new requests
paths:
  /requests/{id}:
    get:
      tags:
      - Activity requests
      summary: Get request details
      description: "Returns the request, current registration state and participant\
        \ list."
      operationId: getRequestDetails
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Request details retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActivityRequestDetailsDto"
        "400":
          description: Malformed request UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Activity requests
      summary: Edit activity request
      description: The organizer updates a planned request. The new capacity must
        fit current participants and stay within the sport's limits.
      operationId: updateRequest
      parameters:
      - name: id
        in: path
        description: UUID of the request
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID. Core Service does not currently authenticate this
          header.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityRequestDto"
        required: true
      responses:
        "200":
          description: Updated request details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActivityRequestDetailsDto"
        "400":
          description: Invalid request data or capacity outside sport limits
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned or capacity is below joined player count
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests:
    get:
      tags:
      - Activity requests
      summary: Geo-search for requests
      description: "Returns future planned requests with open registration within\
        \ the search radius, ordered by distance. Sport and date filters are optional."
      operationId: searchNearbyRequests
      parameters:
      - name: lat
        in: query
        description: Latitude
        required: true
        schema:
          type: number
          format: double
          maximum: 90.0
          minimum: -90.0
        example: 55.7558
      - name: lon
        in: query
        description: Longitude
        required: true
        schema:
          type: number
          format: double
          maximum: 180.0
          minimum: -180.0
        example: 37.6173
      - name: radius
        in: query
        description: Radius of search in meters
        required: false
        schema:
          type: number
          format: double
          default: 5000.0
          exclusiveMinimum: 0
        example: 5000
      - name: sportId
        in: query
        description: Filter by sport type (optional)
        required: false
        schema:
          type: integer
          format: int64
        example: 1
      - name: startDate
        in: query
        description: Begin of time window (ISO-8601)
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-09-10T10:00:00Z
      - name: endDate
        in: query
        description: End of time window (ISO-8601)
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-09-12T22:00:00Z
      responses:
        "200":
          description: "Nearby requests, possibly empty"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityRequestFeedDto"
        "400":
          description: "Invalid coordinates, radius or date range"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Activity requests
      summary: Create an activity request
      description: Creates a planned request and adds its organizer as the first accepted
        participant. The player limit must be within the selected sport's bounds.
      operationId: createRequest
      parameters:
      - name: X-User-Id
        in: header
        description: Caller UUID. Core Service does not currently authenticate this
          header.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequestDto"
        required: true
      responses:
        "201":
          description: Request created; response contains requestId
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
                  format: uuid
        "400":
          description: Invalid request data or player limit
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Sport not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: New requests cannot be created for this sport
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{requestId}/rounds/{roundNumber}/result:
    post:
      tags:
      - Round submissions and completion
      summary: Submit one round result
      description: "Core validates the organizer and players, then queues the result\
        \ for Game Service. A 202 response does not mean Game Service has recorded\
        \ or scored it. Repeated submissions are resolved by Game Service using request\
        \ ID and round number."
      operationId: recordRoundResult
      parameters:
      - name: requestId
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: roundNumber
        in: path
        description: "Round number, starting at 1"
        required: true
        schema:
          type: integer
          format: int32
      - name: X-User-Id
        in: header
        description: Caller UUID supplied by the trusted API Gateway; Core does not
          verify the JWT
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordRoundResultRequestDto"
        required: true
      responses:
        "202":
          description: Round result queued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoundSubmissionAcceptedDto"
        "400":
          description: Invalid round number or player selection
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not active
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{requestId}/complete:
    post:
      tags:
      - Round submissions and completion
      summary: Request asynchronous completion
      description: "Core moves the request to CONFIRMATION and queues a Game Service\
        \ check. Poll GET /requests/{requestId} for COMPLETED or ACTIVE with completionErrorMessage.\
        \ A repeated call while pending does not queue another command."
      operationId: completeRequest
      parameters:
      - name: requestId
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID supplied by the trusted API Gateway; Core does not
          verify the JWT
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Completion check queued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompletionAcceptedDto"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not active
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/start:
    post:
      tags:
      - Activity requests
      summary: Start a request
      description: The organizer starts a planned request after the sport's minimum
        number of players has joined. Registration closes automatically.
      operationId: startRequest
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID. Core Service does not currently authenticate this
          header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Request started
        "400":
          description: Malformed request or caller UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned or has too few players
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/registration/open:
    post:
      tags:
      - Activity requests
      summary: Open registration
      description: The organizer reopens player registration for a planned request.
      operationId: openRegistration
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID. Core Service does not currently authenticate this
          header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Registration opened
        "400":
          description: Malformed request or caller UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/registration/close:
    post:
      tags:
      - Activity requests
      summary: Close registration
      description: The organizer stops accepting new players while the request remains
        planned. Existing participants remain in the request.
      operationId: closeRegistration
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID. Core Service does not currently authenticate this
          header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Registration closed
        "400":
          description: Malformed request or caller UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/leave:
    post:
      tags:
      - Activity requests
      summary: Leave request
      description: "An accepted player leaves a planned request, freeing a place.\
        \ The organizer cannot leave."
      operationId: leaveRequest
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: X-User-Id
        in: header
        description: Caller UUID. Core Service does not currently authenticate this
          header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Player left the request
        "400":
          description: Malformed request or caller UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request or participant not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned or player cannot leave
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/kick/{targetUserId}:
    post:
      tags:
      - Activity requests
      summary: Kick a participant
      description: The organizer kicks an accepted player from a planned request.
        The player cannot rejoin this request.
      operationId: kickParticipant
      parameters:
      - name: id
        in: path
        description: UUID of the request
        required: true
        schema:
          type: string
          format: uuid
      - name: targetUserId
        in: path
        description: UUID of the user to kick
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID. Core Service does not currently authenticate this
          header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Player kicked
        "400":
          description: Organizer attempted to kick themselves
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request or player not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned or player already left or was kicked
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/join:
    post:
      tags:
      - Activity requests
      summary: Join request
      description: Joins a planned request while registration is open and places remain.
        A player who left may rejoin; a kicked player may not.
      operationId: joinRequest
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: X-User-Id
        in: header
        description: Caller UUID. Core Service does not currently authenticate this
          header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Player joined
        "400":
          description: Malformed request data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Registration closed, request full, player already joined or\
            \ kicked"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/cancel:
    post:
      tags:
      - Activity requests
      summary: Cancel activity request
      description: Only the organizer may cancel a planned request. An active or completed
        request cannot be cancelled.
      operationId: cancelRequest
      parameters:
      - name: id
        in: path
        description: UUID of the request
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID. Core Service does not currently authenticate this
          header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Request cancelled
        "400":
          description: Malformed request or caller UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /sports:
    get:
      tags:
      - Sports
      summary: List sports
      description: "Returns all sports, including those no longer playable, with player\
        \ limits and isPlayable."
      operationId: getAllSports
      responses:
        "200":
          description: "Sport catalog, possibly empty"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SportDto"
  /requests/users/{userId}:
    get:
      tags:
      - Activity requests
      summary: Get a user's activity requests
      description: "Returns requests organized by or involving the specified user,\
        \ including inactive requests. Omit statuses to include every request status;\
        \ set forOrganizer to true to return only requests organized by this user."
      operationId: getUserRequestsById
      parameters:
      - name: userId
        in: path
        description: UUID of the user whose requests are returned
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: statuses
        in: query
        description: Optional request statuses. Repeat this query parameter to select
          multiple statuses; omit it for all statuses.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PLANNED
            - ACTIVE
            - CONFIRMATION
            - COMPLETED
            - CANCELLED
            - FROZEN
        example: COMPLETED
      - name: page
        in: query
        description: Zero-based page number; each page contains up to 20 requests.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: forOrganizer
        in: query
        description: "If true, return only requests organized by the specified user;\
          \ if false, include requests they joined."
        required: false
        schema:
          type: boolean
          default: false
        example: false
      responses:
        "200":
          description: "Page of requests, possibly empty"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelActivityRequestInformationDto"
        "400":
          description: "Invalid user UUID, page number or request status"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    UpdateActivityRequestDto:
      type: object
      description: Data for updating an existing activity request
      properties:
        title:
          type: string
          description: Updated title
          example: Friendly football match - new time
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Updated description
          example: Meeting at the GUK (3rd building)
        eventDate:
          type: string
          format: date-time
          description: Updated event date and time (must be in the future)
          example: 2030-06-16T19:00:00Z
        numberOfRounds:
          type: integer
          format: int32
          description: Updated number of rounds
          example: 3
          maximum: 10
          minimum: 1
        maxPlayers:
          type: integer
          format: int32
          description: Updated maximum number of players
          example: 12
          minimum: 2
      required:
      - eventDate
      - maxPlayers
      - numberOfRounds
      - title
    ApiError:
      type: object
      description: Error returned by the Core Service API
      properties:
        code:
          type: string
          description: Stable machine-readable error category
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable explanation
          example: Request body validation failed
        details:
          type: object
          additionalProperties:
            type: string
          description: Field or parameter validation errors; empty for other errors
    ActivityRequestDetailsDto:
      type: object
      description: Detailed information about request room
      properties:
        id:
          type: string
          format: uuid
          description: Unique request ID
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Request title
          example: Friendly football match
        description:
          type: string
          description: Description
          example: "Outdoor match, bring your own boots"
        sportName:
          type: string
          description: Sport name
          example: Football
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players
          example: 10
        currentPlayers:
          type: integer
          format: int32
          description: Current number of accepted players
          example: 4
        eventDate:
          type: string
          format: date-time
          description: Event start date and time
          example: 2030-06-15T18:00:00Z
        addressText:
          type: string
          description: Textual address for display in the card
          example: "Москва, ул. Константина Царева, 12к1"
        numberOfRounds:
          type: integer
          format: int32
          description: Planned number of rounds/sets
          example: 3
        latitude:
          type: number
          format: double
          description: Latitude (for map marker)
          example: 55.715551
        longitude:
          type: number
          format: double
          description: Longitude (for map marker)
          example: 37.554191
        status:
          type: string
          description: Current lifecycle status of the request
          enum:
          - PLANNED
          - ACTIVE
          - CONFIRMATION
          - COMPLETED
          - CANCELLED
          - FROZEN
          example: PLANNED
        completionErrorMessage:
          type: string
          description: "Reason why the latest asynchronous completion check was rejected,\
            \ if any"
        registrationOpen:
          type: boolean
          description: Whether new players can join the request
          example: false
        organizerId:
          type: string
          format: uuid
          description: UUID of the request organizer
          example: 123e4567-e89b-12d3-a456-426614174002
        participants:
          type: array
          description: List of all participants in the room
          items:
            $ref: "#/components/schemas/ParticipantDto"
    ParticipantDto:
      type: object
      description: Information about a specific participant in an activity request
      properties:
        userId:
          type: string
          format: uuid
          description: Unique identifier of the user (used for linking to their public
            profile)
          example: 123e4567-e89b-12d3-a456-426614174000
        role:
          type: string
          description: Role of the user in this specific request
          enum:
          - ORGANIZER
          - PLAYER
          example: PLAYER
        status:
          type: string
          description: Current participation status
          enum:
          - PENDING
          - ACCEPTED
          - KICKED
          - LEFT
          example: ACCEPTED
        joinedAt:
          type: string
          format: date-time
          description: Timestamp when the user joined the request
          example: 2026-09-03T12:00:00Z
    CreateActivityRequestDto:
      type: object
      description: Data for creating new request
      properties:
        title:
          type: string
          description: Title of the activity
          example: Friendly football match
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Description of the activity
          example: "Outdoor match, bring your own boots"
          maxLength: 500
          minLength: 0
        sportId:
          type: integer
          format: int64
          description: ID of the sport (from /sports)
          example: 2
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players (set up by the organizer)
          example: 20
        eventDate:
          type: string
          format: date-time
          description: Future event date and time
          example: 2030-06-15T18:00:00Z
        numberOfRounds:
          type: integer
          format: int32
          description: "Number of rounds to record, from 1 to 10"
          example: 3
          maximum: 10
          minimum: 1
        addressText:
          type: string
          description: Address of the activity
          example: "г. Москва, ул. Константина Царева, 12к1"
          minLength: 1
        latitude:
          type: number
          format: double
          description: Latitude of the activity location
          example: 55.7558
          maximum: 90.0
          minimum: -90.0
        longitude:
          type: number
          format: double
          description: Longitude of the activity location
          example: 37.6173
          maximum: 180.0
          minimum: -180.0
      required:
      - addressText
      - eventDate
      - latitude
      - longitude
      - maxPlayers
      - numberOfRounds
      - sportId
      - title
    RecordRoundResultRequestDto:
      type: object
      description: "Accepted participants who won or lost one round. Both lists must\
        \ be non-empty, disjoint and equal in size."
      properties:
        winners:
          type: array
          description: UUIDs of the round winners; each player may occur only once
          items:
            type: string
            format: uuid
          minItems: 1
        losers:
          type: array
          description: UUIDs of the round losers; each player may occur only once
          items:
            type: string
            format: uuid
          minItems: 1
      required:
      - losers
      - winners
    RoundSubmissionAcceptedDto:
      type: object
