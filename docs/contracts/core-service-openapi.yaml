openapi: 3.1.0
info:
  title: Request Service API
  description: "Create and manage activity requests before a match starts. Players\
    \ apply to join; organizers approve or reject those applications directly in Request\
    \ Service. After a request starts, Game Service owns rounds and results; this\
    \ API exposes the mirrored request status."
  version: v1
servers:
- url: http://localhost:8081/api/v1
  description: Generated server url
tags:
- name: Activity requests
  description: "Create requests, manage participants and registration, and start matches"
- name: Sports
  description: Read the sport catalog and whether each sport accepts new requests
- name: Join requests
  description: Organizer review of pending player applications before an activity
    request starts
paths:
  /requests/{id}:
    get:
      tags:
      - Activity requests
      summary: Get request details
      description: "Returns the request, current registration state and participant\
        \ list. Participants may be PENDING, ACCEPTED or KICKED; only ACCEPTED players\
        \ count towards currentPlayers. After the start, Game owns results and sends\
        \ the completion status asynchronously."
      operationId: getRequestDetails
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Request details retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActivityRequestDetailsDto"
        "400":
          description: Malformed request UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Activity requests
      summary: Edit activity request
      description: The organizer updates a planned request. The new capacity must
        fit accepted and pending players and stay within the sport's limits.
      operationId: updateRequest
      parameters:
      - name: id
        in: path
        description: UUID of the request
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID. Request Service does not currently authenticate
          this header.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityRequestDto"
        required: true
      responses:
        "200":
          description: Updated request details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActivityRequestDetailsDto"
        "400":
          description: Invalid request data or capacity outside sport limits
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned or capacity is below accepted and pending
            player count
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests:
    get:
      tags:
      - Activity requests
      summary: Geo-search for requests
      description: "Returns future planned requests with open registration within\
        \ the search radius, ordered by distance. Sport and date filters are optional."
      operationId: searchNearbyRequests
      parameters:
      - name: lat
        in: query
        description: Latitude
        required: true
        schema:
          type: number
          format: double
          maximum: 90.0
          minimum: -90.0
        example: 55.7558
      - name: lon
        in: query
        description: Longitude
        required: true
        schema:
          type: number
          format: double
          maximum: 180.0
          minimum: -180.0
        example: 37.6173
      - name: radius
        in: query
        description: Radius of search in meters
        required: false
        schema:
          type: number
          format: double
          default: 5000.0
          exclusiveMinimum: 0
        example: 5000
      - name: sportId
        in: query
        description: Filter by sport name used as its ID (optional)
        required: false
        schema:
          type: string
        example: Футбол
      - name: startDate
        in: query
        description: Begin of time window (ISO-8601)
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-09-10T10:00:00Z
      - name: endDate
        in: query
        description: End of time window (ISO-8601)
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-09-12T22:00:00Z
      responses:
        "200":
          description: "Nearby requests, possibly empty"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityRequestFeedDto"
        "400":
          description: "Invalid coordinates, radius or date range"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Activity requests
      summary: Create an activity request
      description: Creates a planned request and adds its organizer as the first accepted
        participant. The player limit must be within the selected sport's bounds.
      operationId: createRequest
      parameters:
      - name: X-User-Id
        in: header
        description: Caller UUID. Request Service does not currently authenticate
          this header.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequestDto"
        required: true
      responses:
        "201":
          description: Request created with its organizer accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateRequestResponseDto"
        "400":
          description: Invalid request data or player limit
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Sport not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: New requests cannot be created for this sport
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{requestId}/join-requests/{participantId}/decision:
    post:
      tags:
      - Join requests
      summary: Approve or reject a join request
      description: Only the organizer may decide a pending application while the activity
        request is PLANNED. Approval changes the player to ACCEPTED immediately and
        sets joinedAt. Rejection deletes the pending record. A later application by
        the same user has a different participantId. The decision is committed in
        Request Service; no Game Service message is used. Closing registration blocks
        new applications but does not block decisions on existing ones.
      operationId: decideJoinRequest
      parameters:
      - name: requestId
        in: path
        description: Activity request UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: participantId
        in: path
        description: ID of the pending participant record returned by the list endpoint
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID supplied by the API Gateway. Request Service does
          not authenticate this header itself.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinDecisionRequestDto"
        required: true
      responses:
        "204":
          description: Decision applied; no response body
        "400":
          description: Missing or malformed UUID or accepted flag
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Activity request or specified application not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Activity request is no longer planned or the application is
            no longer pending
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/start:
    post:
      tags:
      - Activity requests
      summary: Start a request
      description: "The organizer starts a planned request once the sport's minimum\
        \ number of players has been accepted. Registration closes, pending join attempts\
        \ are removed, and a snapshot of the accepted roster is queued for Game and\
        \ Chat. A 204 response means the snapshot is durably queued, not yet processed\
        \ by either consumer."
      operationId: startRequest
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID. Request Service does not currently authenticate
          this header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Request marked ACTIVE; start snapshot queued
        "400":
          description: Malformed request or caller UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned or has too few players
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/registration/open:
    post:
      tags:
      - Activity requests
      summary: Open registration
      description: The organizer reopens player registration for a planned request.
      operationId: openRegistration
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID. Request Service does not currently authenticate
          this header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Registration opened
        "400":
          description: Malformed request or caller UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/registration/close:
    post:
      tags:
      - Activity requests
      summary: Close registration
      description: The organizer stops new join requests while the request remains
        planned. Earlier pending requests can still be approved.
      operationId: closeRegistration
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID. Request Service does not currently authenticate
          this header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Registration closed
        "400":
          description: Malformed request or caller UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/leave:
    post:
      tags:
      - Activity requests
      summary: Leave request
      description: Removes an accepted or pending player from a planned request. An
        application withdrawn this way can no longer be approved. Rejoining requires
        a new application; the organizer cannot leave.
      operationId: leaveRequest
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: X-User-Id
        in: header
        description: Caller UUID. Request Service does not currently authenticate
          this header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Player left the request
        "400":
          description: Malformed request or caller UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request or participant not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned or player cannot leave
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/kick/{targetUserId}:
    post:
      tags:
      - Activity requests
      summary: Kick a participant
      description: The organizer removes an accepted or pending player from a planned
        request. The KICKED record is retained to prevent another join request.
      operationId: kickParticipant
      parameters:
      - name: id
        in: path
        description: UUID of the request
        required: true
        schema:
          type: string
          format: uuid
      - name: targetUserId
        in: path
        description: UUID of the user to kick
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID. Request Service does not currently authenticate
          this header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Player kicked
        "400":
          description: Organizer attempted to kick themselves
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request or player not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned or player was already kicked
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/join:
    post:
      tags:
      - Activity requests
      summary: Request to join
      description: Creates a PENDING application for a planned request and reserves
        one place. The organizer reviews it in Request Service. Approval changes the
        player to ACCEPTED; rejection removes the application. A player who leaves
        must apply again.
      operationId: joinRequest
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: X-User-Id
        in: header
        description: Caller UUID. Request Service does not currently authenticate
          this header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Application stored as PENDING for organizer review
        "400":
          description: Malformed request data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Registration closed, all places reserved, or player already\
            \ pending, accepted or kicked"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/{id}/cancel:
    post:
      tags:
      - Activity requests
      summary: Cancel activity request
      description: Only the organizer may cancel a planned request. An active or completed
        request cannot be cancelled.
      operationId: cancelRequest
      parameters:
      - name: id
        in: path
        description: UUID of the request
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID. Request Service does not currently authenticate
          this header.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Request cancelled
        "400":
          description: Malformed request or caller UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not planned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /sports:
    get:
      tags:
      - Sports
      summary: List sports
      description: "Returns all sports, including those no longer playable, with player\
        \ limits and isPlayable."
      operationId: getAllSports
      responses:
        "200":
          description: "Sport catalog, possibly empty"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SportDto"
  /requests/{requestId}/join-requests:
    get:
      tags:
      - Join requests
      summary: List pending join requests
      description: Returns pending applications for this request. Only its organizer
        may view them. A participantId identifies one application and is required
        when deciding it. An empty array means there are no pending applications.
        Registration may be closed; existing applications remain visible.
      operationId: getPendingJoinRequests
      parameters:
      - name: requestId
        in: path
        description: Activity request UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Caller UUID supplied by the API Gateway. Request Service does
          not authenticate this header itself.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Pending applications, possibly empty"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingJoinRequestDto"
        "400":
          description: Missing or malformed request or caller UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Caller is not the organizer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Activity request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Activity request is no longer planned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /requests/users/{userId}:
    get:
      tags:
      - Activity requests
      summary: Get a user's activity requests
      description: "Returns requests organized by the specified user or with their\
        \ stored participation record, including pending and kicked participants and\
        \ inactive requests. Players who left or were rejected have no participant\
        \ record and are not included. Omit statuses to include every request status;\
        \ set forOrganizer to true to return only requests organized by this user."
      operationId: getUserRequestsById
      parameters:
      - name: userId
        in: path
        description: UUID of the user whose requests are returned
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: statuses
        in: query
        description: Optional request statuses. Repeat this query parameter to select
          multiple statuses; omit it for all statuses.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PLANNED
            - ACTIVE
            - COMPLETED
            - CANCELLED
            - FROZEN
        example: COMPLETED
      - name: page
        in: query
        description: Zero-based page number; each page contains up to 20 requests.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: forOrganizer
        in: query
        description: "If true, return only requests organized by the specified user;\
          \ if false, include requests they joined."
        required: false
        schema:
          type: boolean
          default: false
        example: false
      responses:
        "200":
          description: "Page of requests, possibly empty"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelActivityRequestInformationDto"
        "400":
          description: "Invalid user UUID, page number or request status"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    UpdateActivityRequestDto:
      type: object
      description: Data for updating an existing activity request
      properties:
        title:
          type: string
          description: Updated title
          example: Friendly football match - new time
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Updated description
          example: Meeting at the GUK (3rd building)
        eventDate:
          type: string
          format: date-time
          description: Updated event date and time (must be in the future)
          example: 2030-06-16T19:00:00Z
        numberOfRounds:
          type: integer
          format: int32
          description: Updated number of rounds
          example: 3
          maximum: 10
          minimum: 1
        maxPlayers:
          type: integer
          format: int32
          description: Updated maximum number of players
          example: 12
          minimum: 2
      required:
      - eventDate
      - maxPlayers
      - numberOfRounds
      - title
    ApiError:
      type: object
      description: Error returned by the Request Service API
      properties:
        code:
          type: string
          description: Stable machine-readable error category
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable explanation
          example: Request body validation failed
        details:
          type: object
          additionalProperties:
            type: string
          description: Field or parameter validation errors; empty for other errors
    ActivityRequestDetailsDto:
      type: object
      description: Detailed information about request room
      properties:
        id:
          type: string
          format: uuid
          description: Unique request ID
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Request title
          example: Friendly football match
        description:
          type: string
          description: Description
          example: "Outdoor match, bring your own boots"
        sportName:
          type: string
          description: "Sport name, also used as the sport ID"
          example: Футбол
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players
          example: 10
        currentPlayers:
          type: integer
          format: int32
          description: Current number of accepted players
          example: 4
        eventDate:
          type: string
          format: date-time
          description: Event start date and time
          example: 2030-06-15T18:00:00Z
        addressText:
          type: string
          description: Textual address for display in the card
          example: "Москва, ул. Константина Царева, 12к1"
        numberOfRounds:
          type: integer
          format: int32
          description: Planned number of rounds/sets
          example: 3
        latitude:
          type: number
          format: double
          description: Latitude (for map marker)
          example: 55.715551
        longitude:
          type: number
          format: double
          description: Longitude (for map marker)
          example: 37.554191
        status:
          type: string
          description: Current lifecycle status of the request
          enum:
          - PLANNED
          - ACTIVE
          - COMPLETED
          - CANCELLED
          - FROZEN
          example: PLANNED
        registrationOpen:
          type: boolean
          description: Whether the organizer has registration open; status and capacity
            also govern joining
          example: false
        organizerId:
          type: string
          format: uuid
          description: UUID of the request organizer
          example: 123e4567-e89b-12d3-a456-426614174002
        participants:
          type: array
          description: "Stored participant records, including pending and kicked players"
          items:
            $ref: "#/components/schemas/ParticipantDto"
    ParticipantDto:
      type: object
      description: Information about a specific participant in an activity request
      properties:
        userId:
          type: string
          format: uuid
          description: Unique identifier of the user (used for linking to their public
            profile)
          example: 123e4567-e89b-12d3-a456-426614174000
        role:
          type: string
          description: Role of the user in this specific request
          enum:
          - ORGANIZER
          - PLAYER
          example: PLAYER
        status:
          type: string
          description: Current participation status
          enum:
          - PENDING
          - ACCEPTED
          - KICKED
          example: ACCEPTED
        joinedAt:
          type: string
          format: date-time
          description: Time of acceptance; null if this player was never approved
          example: 2030-06-15T12:00:00Z
    CreateActivityRequestDto:
      type: object
      description: Data for creating new request
      properties:
        title:
          type: string
          description: Title of the activity
          example: Friendly football match
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Description of the activity
          example: "Outdoor match, bring your own boots"
          maxLength: 500
          minLength: 0
        sportId:
          type: string
          description: Sport name used as its ID (from GET /sports)
          example: Футбол
          minLength: 1
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players (set up by the organizer)
          example: 20
        eventDate:
          type: string
          format: date-time
          description: Future event date and time
          example: 2030-06-15T18:00:00Z
        numberOfRounds:
          type: integer
          format: int32
          description: "Planned number of rounds (1–10), sent to Game when the request\
            \ starts"
          example: 3
          maximum: 10
          minimum: 1
        addressText:
          type: string
          description: Address of the activity
          example: "г. Москва, ул. Константина Царева, 12к1"
          minLength: 1
        latitude:
          type: number
          format: double
          description: Latitude of the activity location
          example: 55.7558
          maximum: 90.0
          minimum: -90.0
        longitude:
          type: number
          format: double
          description: Longitude of the activity location
          example: 37.6173
          maximum: 180.0
          minimum: -180.0
      required:
      - addressText
      - eventDate
      - latitude
      - longitude
      - maxPlayers
      - numberOfRounds
      - sportId
      - title
    CreateRequestResponseDto:
      type: object
      description: Identifier of the newly created planned request
      properties:
        requestId:
          type: string
          format: uuid
          description: Request UUID
          example: 123e4567-e89b-12d3-a456-426614174000
    JoinDecisionRequestDto:
      type: object
      description: Organizer's decision for one pending application
      properties:
        accepted:
          type: boolean
          description: true accepts the player; false rejects the application and
            removes its pending record
          example: true
      required:
      - accepted
    SportDto:
      type: object
      description: Data transfer object representing a sport category available in
        the system
      properties:
        id:
          type: string
          description: Sport ID; equal to its name
          example: Футбол
        name:
          type: string
          description: Display name of the sport; currently also its ID
          example: Футбол
        minPlayers:
          type: integer
          format: int32
          description: Absolute minimum number of players required for a match
          example: 10
        maxPlayers:
          type: integer
          format: int32
          description: Absolute maximum number of players allowed for a match
          example: 22
        iconUrl:
          type: string
          description: Optional URL of the sport icon; may be null
        isPlayable:
          type: boolean
          description: Whether new activity requests may be created for this sport
    ActivityRequestFeedDto:
      type: object
      description: Short information about the request to display in the search feed
      properties:
        id:
          type: string
          format: uuid
          description: Unique request ID
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Request title
          example: Friendly football match
        sportName:
          type: string
          description: "Sport name, also used as the sport ID"
          example: Футбол
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players
          example: 10
        currentPlayers:
          type: integer
          format: int32
          description: Current number of accepted players
          example: 4
        eventDate:
          type: string
          format: date-time
          description: Event start date and time
          example: 2030-06-15T18:00:00Z
        addressText:
          type: string
          description: Textual address for display in the card
          example: "Москва, ул. Константина Царева, 12к1"
        numberOfRounds:
          type: integer
          format: int32
          description: Planned number of rounds/sets
          example: 3
        registrationOpen:
          type: boolean
          description: Whether the organizer has registration open; capacity also
            governs joining
          example: true
        latitude:
          type: number
          format: double
          description: Latitude (for map marker)
          example: 55.715551
        longitude:
          type: number
          format: double
          description: Longitude (for map marker)
          example: 37.554191
    PendingJoinRequestDto:
      type: object
      description: A pending application to join an activity request. The participant
        ID identifies this specific application; a later application by the same user
        gets a new ID.
      properties:
        participantId:
          type: string
          format: uuid
          description: ID of the pending participant record to use when deciding
          example: 11111111-1111-1111-1111-111111111111
        requestId:
          type: string
          format: uuid
          description: Activity request ID
          example: 22222222-2222-2222-2222-222222222222
        userId:
          type: string
          format: uuid
          description: ID of the user asking to join
          example: 33333333-3333-3333-3333-333333333333
    ActivityRequestInformationDto:
      type: object
      description: Summary of a request organized by or involving the selected user
      properties:
        id:
          type: string
          format: uuid
          description: Unique request ID
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Request title
          example: Friendly football match
        sportName:
          type: string
          description: Sport name
          example: Football
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players
          example: 10
        currentPlayers:
          type: integer
          format: int32
          description: Current number of accepted players
          example: 4
        eventDate:
          type: string
          format: date-time
          description: Event start date and time
          example: 2030-06-15T18:00:00Z
        addressText:
          type: string
          description: Textual address for display in the card
          example: "Москва, ул. Константина Царева, 12к1"
        numberOfRounds:
          type: integer
          format: int32
          description: Planned number of rounds/sets
          example: 3
        status:
          type: string
          description: Current lifecycle status of the request
          enum:
          - PLANNED
          - ACTIVE
          - COMPLETED
          - CANCELLED
          - FROZEN
          example: PLANNED
        registrationOpen:
          type: boolean
          description: Whether new players can join the request
          example: true
        latitude:
          type: number
          format: double
          description: Latitude (for map marker)
          example: 55.715551
        longitude:
          type: number
          format: double
          description: Longitude (for map marker)
          example: 37.554191
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelActivityRequestInformationDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ActivityRequestInformationDto"
        page:
          $ref: "#/components/schemas/PageMetadata"
