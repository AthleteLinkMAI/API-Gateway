openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080/api/v1
  description: Generated server url
paths:
  /report:
    get:
      tags:
      - report-controller
      operationId: getReportById
      parameters:
      - name: X-User-Role
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMIN
          - MODERATOR
          - USER
      - name: reportId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReportControllerDto"
    post:
      tags:
      - report-controller
      operationId: report
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportToCreate"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReportControllerDto"
  /message/private:
    post:
      tags:
      - message-controller
      operationId: createPrivateMessage
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateMessageToCreateControllerDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PrivateMessageControllerDto"
  /message/chat:
    post:
      tags:
      - message-controller
      operationId: createChatMessage
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageControllerDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatMessageControllerDto"
  /message/activity-request:
    post:
      tags:
      - message-controller
      operationId: createActivityRequestMessage
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityRequestMessageToCreateControllerDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActivityRequestMessageControllerDto"
  /report/{userId}:
    get:
      tags:
      - report-controller
      operationId: getAllPaginatedShortReportsByUserId
      parameters:
      - name: X-User-Role
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMIN
          - MODERATOR
          - USER
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShortReportControllerDto"
  /report/all:
    get:
      tags:
