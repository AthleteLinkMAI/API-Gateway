  /report/{responderId}:
    delete:
      tags:
      - report-controller
      operationId: closeAllReportsByResponderId
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Role
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMIN
          - MODERATOR
          - USER
      - name: responderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
components:
  schemas:
    ReportToCreate:
      type: object
      properties:
        responderId:
          type: string
          format: uuid
        activityRequestId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        violation:
          type: string
          enum:
          - FRAUD
          - OFFENCE
        description:
          type: string
      required:
      - responderId
      - violation
    ReportControllerDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
        responderId:
          type: string
          format: uuid
        activityRequestId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        violation:
          type: string
          enum:
          - FRAUD
          - OFFENCE
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    PrivateMessageToCreateControllerDto:
      type: object
      properties:
        recipientId:
          type: string
          format: uuid
        message:
          type: string
    PrivateMessageControllerDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    ChatMessageControllerDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        chatId:
          type: string
          format: uuid
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    ActivityRequestMessageToCreateControllerDto:
      type: object
      properties:
        activityRequestId:
          type: string
          format: uuid
        message:
          type: string
    ActivityRequestMessageControllerDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        activityRequestId:
          type: string
          format: uuid
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    ShortReportControllerDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
        responderId:
          type: string
          format: uuid
        violation:
          type: string
          enum:
          - FRAUD
          - OFFENCE
    PaginatedPrivateMessagesControllerDto:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/PrivateMessageControllerDto"
        cursor:
          type: string
          format: uuid
    PaginatedChatMessagesControllerDto:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessageControllerDto"
        cursor:
          type: string
          format: uuid
    PaginatedActivityRequestMessagesControllerDto:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ActivityRequestMessageControllerDto"
        cursor:
          type: string
          format: uuid
