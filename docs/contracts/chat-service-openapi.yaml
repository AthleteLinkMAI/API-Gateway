      operationId: getPaginatedPrivateMessagesByRecipientId
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: recipientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: size
        in: query
        required: true
        schema:
          type: integer
          format: int32
