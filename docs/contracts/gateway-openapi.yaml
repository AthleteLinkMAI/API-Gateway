          type: string
          enum:
          - PENDING
          - CONFIRMED
          - DISPUTED
        createdAt:
          type: string
          format: date-time
        players:
          type: array
          items:
            "$ref": "#/components/schemas/Game_PlayerResultDto"
    Game_RankTierDto:
      type: object
      description: Configured score threshold for a rank tier
      properties:
        name:
          type: string
          description: Rank name
          example: GOLD
        tier:
          type: integer
          format: int32
          description: Tier number from 1 to 3
          example: 1
        scoreMin:
          type: integer
          format: int32
          description: Minimum score included in this rank
          example: 1200
        scoreMax:
          type: integer
          format: int32
          description: Maximum score included in this rank
          example: 1399
    Game_PlayerSummaryDto:
      type: object
      description: Aggregated player statistics
      properties:
        userId:
          type: string
          format: uuid
          description: User ID
          example: 123e4567-e89b-12d3-a456-426614174000
        summary:
          "$ref": "#/components/schemas/Game_Summary"
          description: Aggregated statistics across all sports
    Game_Summary:
      type: object
      properties:
        sportsPlayed:
          type: integer
          format: int64
          description: Number of sports played
          example: 2
        roundsPlayed:
          type: integer
          format: int32
          description: Total number of rounds
          example: 12
        wins:
          type: integer
          format: int32
          description: Total wins
          example: 7
        losses:
          type: integer
          format: int32
          description: Total losses
          example: 4
        draws:
          type: integer
          format: int32
          description: Total draws
          example: 1
    Game_PlayerSportDetailsDto:
      type: object
      description: Player statistics for one sport
      properties:
        userId:
          type: string
          format: uuid
          description: User ID
        sportId:
          type: integer
          format: int64
          description: Sport ID
          example: 1
        roundsPlayed:
          type: integer
          format: int32
          description: Rounds played in this sport
          example: 8
        wins:
          type: integer
          format: int32
          description: Wins in this sport
          example: 5
        losses:
          type: integer
          format: int32
          description: Losses in this sport
          example: 2
        draws:
          type: integer
          format: int32
          description: Draws in this sport
          example: 1
        score:
          type: integer
          format: int32
          description: Current score
          example: 1200
        leaderboardPlace:
          type: integer
          format: int64
          description: Current leaderboard place
          example: 7
        rank:
          "$ref": "#/components/schemas/Game_RankDto"
          description: Rank calculated from score
    Game_RankDto:
      type: object
      description: Player rank calculated from score
      properties:
        name:
          type: string
          description: Rank name
          example: GOLD
        tier:
          type: integer
          format: int32
          description: Rank tier
          example: 1
        scoreMin:
          type: integer
          format: int32
          description: Minimum score
          example: 1200
        scoreMax:
          type: integer
          format: int32
          description: Maximum score
          example: 1399
    Game_OtherSportDto:
      type: object
      description: Statistics for a sport other than the player's highest-scoring
        sport
      properties:
        sportId:
          type: integer
          format: int64
        score:
          type: integer
          format: int32
        nextRankScore:
          type: integer
          format: int32
          description: Score required for the next rank; null at the highest rank
        rank:
          "$ref": "#/components/schemas/Game_RankDto"
    Game_PlayerRoundHistoryDto:
      type: object
      description: One round in a player's history
      properties:
        roundResultId:
          type: string
          format: uuid
        activityRequestId:
          type: string
          format: uuid
        roundNumber:
          type: integer
          format: int32
        sportId:
          type: integer
          format: int64
        outcome:
          type: string
          enum:
          - WIN
          - LOSS
          - DRAW
        ratingChange:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    Game_LastGameDto:
      type: object
      description: The most recently recorded round played by a user
      properties:
        roundResultId:
          type: string
          format: uuid
        activityRequestId:
          type: string
          format: uuid
        roundNumber:
          type: integer
          format: int32
        sportId:
          type: integer
          format: int64
        outcome:
          type: string
          enum:
          - WIN
          - LOSS
          - DRAW
        createdAt:
          type: string
          format: date-time
          description: Time the result was recorded, not the date the game was played
        playerIds:
          type: array
          description: User IDs of all participants in this round, including the requested
            player
          items:
            type: string
            format: uuid
    Game_BestSportDto:
      type: object
      description: Player's highest-scoring sport
      properties:
        sportId:
          type: integer
          format: int64
        score:
          type: integer
          format: int32
        nextRankScore:
          type: integer
          format: int32
          description: Score required for the next rank; null at the highest rank
        leaderboardPlace:
          type: integer
          format: int64
          description: Place among players of this sport; equal scores share a place
        wins:
          type: integer
          format: int32
        winRatePercent:
          type: number
          format: double
