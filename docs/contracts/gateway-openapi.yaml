  "/api/v1/requests/{requestId}/rounds/{roundNumber}/result":
    post:
      tags:
      - Round submissions and completion
      summary: Submit one round result
      description: Core validates the organizer and players, then queues the result
        for Game Service. A 202 response does not mean Game Service has recorded or
        scored it. Repeated submissions are resolved by Game Service using request
        ID and round number.
      operationId: recordRoundResult
      parameters:
      - name: requestId
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: roundNumber
        in: path
        description: Round number, starting at 1
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Core_RecordRoundResultRequestDto"
        required: true
      responses:
        '202':
          description: Round result queued
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_RoundSubmissionAcceptedDto"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '400':
          description: Invalid round number or player selection
