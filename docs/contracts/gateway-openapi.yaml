# Сгенерировано scripts/build_gateway_openapi.rb из снимков сервисов в репозитории.
# Черновик: соответствие работающих сборок Core, Auth и Game снимкам не проверено.
---
openapi: 3.1.0
info:
  title: AthleteLink — шлюз API
  version: draft
  description: Черновой публичный HTTP-контракт, собранный из снимков OpenAPI Core,
    Auth и Game в репозитории и таблицы маршрутов Gateway. Gateway пересылает тела
    запросов и ответов целевых сервисов без преобразования и принимает только пары
    метода и пути из своей таблицы маршрутов. Снимки сервисов объявляют /api/v1 в
    servers.url; соответствие работающим сборкам не проверено. Для собственных ошибок
    Gateway нет обязательной схемы тела ответа.
servers:
- url: "/"
  description: Корень Gateway; источник развёртывания настраивается отдельно.
paths:
  "/api/v1/requests/{id}":
    get:
      tags:
      - Activity requests
      summary: Get request details
      description: Returns the request, current registration state and participant
        list.
      operationId: getRequestDetails
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Request details retrieved successfully
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ActivityRequestDetailsDto"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '400':
          description: Malformed request UUID
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '404':
          description: Request not found
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '401':
          description: Gateway отклонил запрос из-за отсутствующего или недействительного
            токена доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '503':
          description: Gateway не смог завершить проверку списка отозванных токенов
            доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '502':
          description: Gateway не смог соединиться с целевым сервисом.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '504':
          description: Gateway не дождался ответа целевого сервиса до истечения тайм-аута.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
      security:
      - BearerAuth: []
    put:
      tags:
      - Activity requests
      summary: Edit activity request
      description: The organizer updates a planned request. The new capacity must
        fit current participants and stay within the sport's limits.
      operationId: updateRequest
      parameters:
      - name: id
        in: path
        description: UUID of the request
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Core_UpdateActivityRequestDto"
        required: true
      responses:
        '200':
          description: Updated request details
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ActivityRequestDetailsDto"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '400':
          description: Invalid request data or capacity outside sport limits
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '403':
          description: Caller is not the organizer
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '404':
