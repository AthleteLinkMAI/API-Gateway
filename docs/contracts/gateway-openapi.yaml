  "/api/v1/requests/users/{userId}":
    get:
      tags:
      - Activity requests
      summary: Get a user's activity requests
      description: Returns requests organized by or involving the specified user,
        including inactive requests. Omit statuses to include every request status;
        set forOrganizer to true to return only requests organized by this user.
      operationId: getUserRequestsById
      parameters:
      - name: userId
        in: path
        description: UUID of the user whose requests are returned
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: statuses
        in: query
        description: Optional request statuses. Repeat this query parameter to select
          multiple statuses; omit it for all statuses.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PLANNED
            - ACTIVE
            - CONFIRMATION
            - COMPLETED
            - CANCELLED
            - FROZEN
        example: COMPLETED
      - name: page
        in: query
        description: Zero-based page number; each page contains up to 20 requests.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: forOrganizer
        in: query
        description: If true, return only requests organized by the specified user;
          if false, include requests they joined.
        required: false
        schema:
          type: boolean
          default: false
        example: false
      responses:
        '200':
          description: Page of requests, possibly empty
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_PagedModelActivityRequestInformationDto"
          headers:
            X-Request-Id:
