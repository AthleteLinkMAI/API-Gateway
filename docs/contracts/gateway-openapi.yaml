          description: Уникальный идентификатор пользователя (для ссылки на его публичный
            профиль)
          example: 123e4567-e89b-12d3-a456-426614174000
        role:
          type: string
          description: Роль пользователя в этой заявке
          enum:
          - ORGANIZER
          - PLAYER
          example: PLAYER
        status:
          type: string
          description: Текущий статус участия
          enum:
          - PENDING
          - ACCEPTED
          - KICKED
          - LEFT
