              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
      security:
      - BearerAuth: []
      description: Gateway пересылает этот вызов на /api/v1/players/{sub}, используя
        субъект проверенного токена доступа. /api/v1/players и /api/v1/players/ работают
        без перенаправления.
  "/healthz":
    get:
      operationId: gatewayHealth
      tags:
      - Gateway
      security: []
      responses:
        '200':
          description: Процесс Gateway работает.
          content:
            text/plain:
              schema:
                type: string
                example: 'ok

'
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
  "/readyz":
    get:
      operationId: gatewayReadiness
      tags:
      - Gateway
      security: []
      responses:
        '200':
          description: Gateway и настроенные зависимости готовы.
          content:
            text/plain:
              schema:
                type: string
                example: 'ok

'
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '503':
          description: Gateway или настроенная зависимость не готовы.
          content:
            text/plain:
              schema:
                type: string
                example: 'not ready

'
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Core_UpdateActivityRequestDto:
      type: object
      description: Данные для изменения существующей заявки на игру
      properties:
        title:
          type: string
          description: Обновлённое название
          example: Friendly football match - new time
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Обновлённое описание
          example: Meeting at the GUK (3rd building)
        eventDate:
          type: string
          format: date-time
          description: Обновлённые дата и время события (должны быть в будущем)
          example: 2030-06-16 19:00:00.000000000 Z
        numberOfRounds:
          type: integer
          format: int32
          description: Обновлённое число раундов
          example: 3
          maximum: 10
          minimum: 1
        maxPlayers:
          type: integer
          format: int32
          description: Обновлённое максимальное число игроков
          example: 12
          minimum: 2
      required:
      - eventDate
      - maxPlayers
      - numberOfRounds
      - title
    Core_ApiError:
      type: object
      description: Ошибка, возвращаемая API Core Service
      properties:
        code:
          type: string
          description: Стабильная машиночитаемая категория ошибки
          example: VALIDATION_ERROR
        message:
          type: string
          description: Объяснение для человека
          example: Request body validation failed
        details:
          type: object
          additionalProperties:
            type: string
          description: Ошибки проверки полей или параметров; пусто для других ошибок
    Core_ActivityRequestDetailsDto:
      type: object
      description: Подробные сведения о комнате заявки
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный ID заявки
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Название заявки
          example: Friendly football match
        description:
          type: string
          description: Описание
          example: Outdoor match, bring your own boots
        sportName:
          type: string
          description: Название вида спорта
          example: Football
        maxPlayers:
          type: integer
          format: int32
          description: Максимальное число игроков
          example: 10
        currentPlayers:
          type: integer
          format: int32
          description: Текущее число принятых игроков
          example: 4
        eventDate:
          type: string
          format: date-time
          description: Дата и время начала события
          example: 2030-06-15 18:00:00.000000000 Z
        addressText:
          type: string
          description: Текстовый адрес для отображения в карточке
          example: Москва, ул. Константина Царева, 12к1
        numberOfRounds:
          type: integer
          format: int32
          description: Запланированное число раундов/сетов
          example: 3
        latitude:
          type: number
          format: double
          description: Широта (для отметки на карте)
          example: 55.715551
        longitude:
          type: number
          format: double
          description: Долгота (для отметки на карте)
          example: 37.554191
        status:
          type: string
          description: Текущий статус жизненного цикла заявки
          enum:
          - PLANNED
          - ACTIVE
          - CONFIRMATION
          - COMPLETED
          - CANCELLED
          - FROZEN
          example: PLANNED
