components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Core_UpdateActivityRequestDto:
      type: object
      description: Data for updating an existing activity request
      properties:
        title:
          type: string
          description: Updated title
          example: Friendly football match - new time
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Updated description
          example: Meeting at the GUK (3rd building)
        eventDate:
          type: string
          format: date-time
          description: Updated event date and time (must be in the future)
          example: 2030-06-16 19:00:00.000000000 Z
        numberOfRounds:
          type: integer
          format: int32
          description: Updated number of rounds
          example: 3
          maximum: 10
          minimum: 1
        maxPlayers:
          type: integer
          format: int32
          description: Updated maximum number of players
          example: 12
          minimum: 2
      required:
      - eventDate
      - maxPlayers
      - numberOfRounds
      - title
    Core_ApiError:
      type: object
      description: Error returned by the Core Service API
      properties:
        code:
          type: string
          description: Stable machine-readable error category
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable explanation
          example: Request body validation failed
        details:
          type: object
          additionalProperties:
            type: string
          description: Field or parameter validation errors; empty for other errors
    Core_ActivityRequestDetailsDto:
      type: object
      description: Detailed information about request room
      properties:
        id:
          type: string
          format: uuid
          description: Unique request ID
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Request title
          example: Friendly football match
        description:
          type: string
          description: Description
          example: Outdoor match, bring your own boots
        sportName:
          type: string
          description: Sport name
          example: Football
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players
          example: 10
        currentPlayers:
          type: integer
          format: int32
          description: Current number of accepted players
          example: 4
        eventDate:
          type: string
          format: date-time
          description: Event start date and time
          example: 2030-06-15 18:00:00.000000000 Z
        addressText:
          type: string
          description: Textual address for display in the card
          example: Москва, ул. Константина Царева, 12к1
        numberOfRounds:
          type: integer
          format: int32
          description: Planned number of rounds/sets
          example: 3
        latitude:
          type: number
          format: double
          description: Latitude (for map marker)
          example: 55.715551
        longitude:
          type: number
          format: double
          description: Longitude (for map marker)
          example: 37.554191
        status:
          type: string
          description: Current lifecycle status of the request
          enum:
          - PLANNED
          - ACTIVE
          - CONFIRMATION
          - COMPLETED
          - CANCELLED
          - FROZEN
          example: PLANNED
        completionErrorMessage:
          type: string
          description: Reason why the latest asynchronous completion check was rejected,
            if any
        registrationOpen:
          type: boolean
          description: Whether new players can join the request
          example: false
        organizerId:
          type: string
          format: uuid
          description: UUID of the request organizer
          example: 123e4567-e89b-12d3-a456-426614174002
        participants:
          type: array
          description: List of all participants in the room
          items:
            "$ref": "#/components/schemas/Core_ParticipantDto"
    Core_ParticipantDto:
      type: object
      description: Information about a specific participant in an activity request
      properties:
        userId:
          type: string
          format: uuid
          description: Unique identifier of the user (used for linking to their public
            profile)
          example: 123e4567-e89b-12d3-a456-426614174000
        role:
          type: string
          description: Role of the user in this specific request
          enum:
          - ORGANIZER
          - PLAYER
          example: PLAYER
        status:
          type: string
          description: Current participation status
          enum:
          - PENDING
          - ACCEPTED
          - KICKED
          - LEFT
          example: ACCEPTED
        joinedAt:
          type: string
          format: date-time
          description: Timestamp when the user joined the request
          example: 2026-09-03 12:00:00.000000000 Z
    Core_CreateActivityRequestDto:
      type: object
      description: Data for creating new request
      properties:
        title:
          type: string
          description: Title of the activity
          example: Friendly football match
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Description of the activity
          example: Outdoor match, bring your own boots
          maxLength: 500
          minLength: 0
        sportId:
          type: integer
          format: int64
          description: ID of the sport (from /sports)
          example: 2
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players (set up by the organizer)
          example: 20
        eventDate:
          type: string
          format: date-time
          description: Future event date and time
          example: 2030-06-15 18:00:00.000000000 Z
        numberOfRounds:
          type: integer
          format: int32
          description: Number of rounds to record, from 1 to 10
          example: 3
          maximum: 10
          minimum: 1
        addressText:
          type: string
          description: Address of the activity
          example: г. Москва, ул. Константина Царева, 12к1
          minLength: 1
        latitude:
          type: number
          format: double
          description: Latitude of the activity location
          example: 55.7558
          maximum: 90.0
          minimum: -90.0
        longitude:
          type: number
          format: double
          description: Longitude of the activity location
          example: 37.6173
          maximum: 180.0
          minimum: -180.0
      required:
      - addressText
      - eventDate
      - latitude
      - longitude
      - maxPlayers
      - numberOfRounds
      - sportId
      - title
    Core_RecordRoundResultRequestDto:
      type: object
      description: Accepted participants who won or lost one round. Both lists must
        be non-empty, disjoint and equal in size.
      properties:
        winners:
          type: array
          description: UUIDs of the round winners; each player may occur only once
          items:
            type: string
            format: uuid
          minItems: 1
        losers:
          type: array
          description: UUIDs of the round losers; each player may occur only once
          items:
            type: string
            format: uuid
          minItems: 1
      required:
      - losers
      - winners
    Core_RoundSubmissionAcceptedDto:
      type: object
      description: A round result command was queued for asynchronous processing by
        Game Service
      properties:
        eventId:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        roundNumber:
          type: integer
          format: int32
    Core_CompletionAcceptedDto:
      type: object
      description: A request completion check is waiting for Game Service verification
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PLANNED
          - ACTIVE
          - CONFIRMATION
          - COMPLETED
          - CANCELLED
          - FROZEN
    Core_SportDto:
      type: object
      description: Data transfer object representing a sport category available in
        the system
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the sport
          example: 1
        name:
          type: string
          description: Display name of the sport
          example: Football
        minPlayers:
          type: integer
          format: int32
          description: Absolute minimum number of players required for a match
          example: 10
        maxPlayers:
          type: integer
          format: int32
          description: Absolute maximum number of players allowed for a match
          example: 22
        iconUrl:
          type: string
          description: Optional URL of the sport icon; may be null
        isPlayable:
          type: boolean
          description: Whether new activity requests may be created for this sport
    Core_ActivityRequestFeedDto:
      type: object
