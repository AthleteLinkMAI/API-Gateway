  "/api/v1/requests":
    get:
      tags:
      - Activity requests
      summary: Geo-search for requests
      description: Returns future planned requests with open registration within the
        search radius, ordered by distance. Sport and date filters are optional.
      operationId: searchNearbyRequests
      parameters:
      - name: lat
        in: query
        description: Latitude
        required: true
        schema:
          type: number
          format: double
          maximum: 90.0
          minimum: -90.0
        example: 55.7558
      - name: lon
        in: query
        description: Longitude
        required: true
        schema:
          type: number
          format: double
          maximum: 180.0
          minimum: -180.0
        example: 37.6173
      - name: radius
        in: query
        description: Radius of search in meters
        required: false
        schema:
          type: number
          format: double
          default: 5000.0
          exclusiveMinimum: 0
        example: 5000
      - name: sportId
        in: query
        description: Filter by sport name used as its ID (optional)
        required: false
        schema:
          type: string
        example: Футбол
      - name: startDate
        in: query
        description: Begin of time window (ISO-8601)
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-09-10 10:00:00.000000000 Z
      - name: endDate
        in: query
        description: End of time window (ISO-8601)
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-09-12 22:00:00.000000000 Z
      responses:
        '200':
          description: Nearby requests, possibly empty
          content:
            "*/*":
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Core_ActivityRequestFeedDto"
          headers:
            X-Request-Id:
