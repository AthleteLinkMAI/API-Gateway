components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Core_UpdateActivityRequestDto:
      type: object
      description: Data for updating an existing activity request
      properties:
        title:
          type: string
          description: Updated title
          example: Friendly football match - new time
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Updated description
          example: Meeting at the GUK (3rd building)
        eventDate:
          type: string
          format: date-time
          description: Updated event date and time (must be in the future)
          example: 2030-06-16 19:00:00.000000000 Z
        numberOfRounds:
          type: integer
          format: int32
          description: Updated number of rounds
          example: 3
          maximum: 10
          minimum: 1
        maxPlayers:
          type: integer
          format: int32
          description: Updated maximum number of players
          example: 12
          minimum: 2
      required:
      - eventDate
      - maxPlayers
      - numberOfRounds
      - title
    Core_ApiError:
      type: object
      description: Error returned by the Request Service API
      properties:
        code:
          type: string
          description: Stable machine-readable error category
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable explanation
          example: Request body validation failed
        details:
          type: object
          additionalProperties:
            type: string
          description: Field or parameter validation errors; empty for other errors
    Core_ActivityRequestDetailsDto:
      type: object
      description: Detailed information about request room
      properties:
        id:
          type: string
          format: uuid
          description: Unique request ID
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Request title
          example: Friendly football match
        description:
          type: string
          description: Description
          example: Outdoor match, bring your own boots
        sportName:
          type: string
          description: Sport name, also used as the sport ID
          example: Футбол
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players
          example: 10
        currentPlayers:
          type: integer
          format: int32
          description: Current number of accepted players
          example: 4
        eventDate:
          type: string
          format: date-time
          description: Event start date and time
          example: 2030-06-15 18:00:00.000000000 Z
        addressText:
          type: string
          description: Textual address for display in the card
          example: Москва, ул. Константина Царева, 12к1
        numberOfRounds:
          type: integer
          format: int32
          description: Planned number of rounds/sets
          example: 3
        latitude:
          type: number
          format: double
          description: Latitude (for map marker)
          example: 55.715551
        longitude:
          type: number
          format: double
          description: Longitude (for map marker)
          example: 37.554191
        status:
          type: string
          description: Current lifecycle status of the request
          enum:
          - PLANNED
          - ACTIVE
          - COMPLETED
          - CANCELLED
          - FROZEN
          example: PLANNED
        registrationOpen:
          type: boolean
          description: Whether the organizer has registration open; status and capacity
            also govern joining
          example: false
        organizerId:
          type: string
          format: uuid
          description: UUID of the request organizer
          example: 123e4567-e89b-12d3-a456-426614174002
        participants:
          type: array
          description: Stored participant records, including pending and kicked players
          items:
            "$ref": "#/components/schemas/Core_ParticipantDto"
    Core_ParticipantDto:
      type: object
      description: Information about a specific participant in an activity request
      properties:
        userId:
          type: string
          format: uuid
          description: Unique identifier of the user (used for linking to their public
            profile)
          example: 123e4567-e89b-12d3-a456-426614174000
        role:
          type: string
          description: Role of the user in this specific request
          enum:
          - ORGANIZER
          - PLAYER
          example: PLAYER
        status:
          type: string
          description: Current participation status
          enum:
          - PENDING
          - ACCEPTED
          - KICKED
          example: ACCEPTED
        joinedAt:
          type: string
          format: date-time
          description: Time of acceptance; null if this player was never approved
          example: 2030-06-15 12:00:00.000000000 Z
    Core_CreateActivityRequestDto:
      type: object
      description: Data for creating new request
      properties:
        title:
          type: string
          description: Title of the activity
          example: Friendly football match
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Description of the activity
          example: Outdoor match, bring your own boots
          maxLength: 500
          minLength: 0
        sportId:
          type: string
          description: Sport name used as its ID (from GET /sports)
          example: Футбол
          minLength: 1
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players (set up by the organizer)
          example: 20
        eventDate:
          type: string
          format: date-time
          description: Future event date and time
          example: 2030-06-15 18:00:00.000000000 Z
        numberOfRounds:
          type: integer
          format: int32
          description: Planned number of rounds (1–10), sent to Game when the request
            starts
          example: 3
          maximum: 10
          minimum: 1
        addressText:
          type: string
          description: Address of the activity
          example: г. Москва, ул. Константина Царева, 12к1
          minLength: 1
        latitude:
          type: number
          format: double
          description: Latitude of the activity location
          example: 55.7558
          maximum: 90.0
          minimum: -90.0
        longitude:
          type: number
          format: double
          description: Longitude of the activity location
          example: 37.6173
          maximum: 180.0
          minimum: -180.0
      required:
      - addressText
      - eventDate
      - latitude
      - longitude
      - maxPlayers
      - numberOfRounds
      - sportId
      - title
    Core_CreateRequestResponseDto:
      type: object
      description: Identifier of the newly created planned request
      properties:
        requestId:
          type: string
          format: uuid
          description: Request UUID
          example: 123e4567-e89b-12d3-a456-426614174000
    Core_JoinDecisionRequestDto:
      type: object
      description: Organizer's decision for one pending application
      properties:
        accepted:
          type: boolean
          description: true accepts the player; false rejects the application and
            removes its pending record
          example: true
      required:
      - accepted
    Core_SportDto:
      type: object
      description: Data transfer object representing a sport category available in
        the system
      properties:
        id:
          type: string
          description: Sport ID; equal to its name
          example: Футбол
        name:
          type: string
          description: Display name of the sport; currently also its ID
          example: Футбол
        minPlayers:
          type: integer
          format: int32
          description: Absolute minimum number of players required for a match
          example: 10
        maxPlayers:
          type: integer
          format: int32
          description: Absolute maximum number of players allowed for a match
          example: 22
        iconUrl:
          type: string
          description: Optional URL of the sport icon; may be null
        isPlayable:
          type: boolean
          description: Whether new activity requests may be created for this sport
    Core_ActivityRequestFeedDto:
      type: object
      description: Short information about the request to display in the search feed
      properties:
        id:
          type: string
          format: uuid
          description: Unique request ID
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Request title
          example: Friendly football match
        sportName:
          type: string
          description: Sport name, also used as the sport ID
          example: Футбол
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players
          example: 10
        currentPlayers:
          type: integer
          format: int32
          description: Current number of accepted players
          example: 4
        eventDate:
          type: string
          format: date-time
          description: Event start date and time
          example: 2030-06-15 18:00:00.000000000 Z
        addressText:
          type: string
          description: Textual address for display in the card
          example: Москва, ул. Константина Царева, 12к1
        numberOfRounds:
          type: integer
          format: int32
          description: Planned number of rounds/sets
          example: 3
        registrationOpen:
          type: boolean
          description: Whether the organizer has registration open; capacity also
            governs joining
          example: true
        latitude:
          type: number
          format: double
          description: Latitude (for map marker)
          example: 55.715551
        longitude:
          type: number
          format: double
          description: Longitude (for map marker)
          example: 37.554191
    Core_PendingJoinRequestDto:
      type: object
      description: A pending application to join an activity request. The participant
        ID identifies this specific application; a later application by the same user
        gets a new ID.
      properties:
        participantId:
          type: string
          format: uuid
          description: ID of the pending participant record to use when deciding
          example: 11111111-1111-1111-1111-111111111111
        requestId:
          type: string
          format: uuid
          description: Activity request ID
          example: 22222222-2222-2222-2222-222222222222
        userId:
          type: string
          format: uuid
          description: ID of the user asking to join
          example: 33333333-3333-3333-3333-333333333333
    Core_ActivityRequestInformationDto:
      type: object
      description: Summary of a request organized by or involving the selected user
      properties:
        id:
          type: string
          format: uuid
          description: Unique request ID
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Request title
          example: Friendly football match
        sportName:
          type: string
          description: Sport name
          example: Football
        maxPlayers:
          type: integer
          format: int32
          description: Maximum number of players
          example: 10
        currentPlayers:
          type: integer
          format: int32
          description: Current number of accepted players
          example: 4
        eventDate:
          type: string
          format: date-time
          description: Event start date and time
          example: 2030-06-15 18:00:00.000000000 Z
        addressText:
          type: string
          description: Textual address for display in the card
          example: Москва, ул. Константина Царева, 12к1
        numberOfRounds:
          type: integer
          format: int32
          description: Planned number of rounds/sets
          example: 3
        status:
          type: string
          description: Current lifecycle status of the request
          enum:
          - PLANNED
          - ACTIVE
          - COMPLETED
          - CANCELLED
          - FROZEN
          example: PLANNED
        registrationOpen:
          type: boolean
          description: Whether new players can join the request
          example: true
        latitude:
          type: number
          format: double
          description: Latitude (for map marker)
          example: 55.715551
        longitude:
          type: number
          format: double
          description: Longitude (for map marker)
          example: 37.554191
    Core_PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
