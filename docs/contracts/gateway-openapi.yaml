# Сгенерировано scripts/build_gateway_openapi.rb из снимков сервисов в репозитории.
---
openapi: 3.1.0
info:
  title: AthleteLink API Gateway
  version: draft
  description: Публичный HTTP-контракт пяти сервисов AthleteLink, собранный из сохранённых
    снимков OpenAPI и таблицы маршрутов Gateway. Тела запросов и ответов передаются
    без преобразования. Gateway проверяет JWT, banlist и denylist. На публичных операциях
    Authorization необязателен, но переданный токен проверяется. Доверенные заголовки
    идентичности и роли выставляет Gateway. Для собственных ошибок Gateway нет обязательной
    схемы тела ответа.
servers:
- url: "/"
  description: Корень Gateway; источник развёртывания настраивается отдельно.
paths:
  "/api/v1/requests/{id}":
    get:
      tags:
      - Activity requests
      summary: Get request details
      description: Returns the request, current registration state and participant
        list. Participants may be PENDING, ACCEPTED or KICKED; only ACCEPTED players
        count towards currentPlayers. After the start, Game owns results and sends
        the completion status asynchronously.
      operationId: getRequestDetails
      parameters:
      - name: id
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Request details retrieved successfully
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ActivityRequestDetailsDto"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '400':
          description: Malformed request UUID
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '404':
          description: Request not found
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '401':
          description: Gateway отклонил отсутствующий, недействительный или отозванный
            access JWT. На публичной операции JWT проверяется только при наличии Authorization.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '403':
          description: Пользователь заблокирован или отсутствует требуемая для операции
            роль.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '503':
          description: Ошибка проверки Redis, кроме недоступности или тайм-аута. При
            недоступности и тайм-ауте запрос допускается.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '502':
          description: Gateway не смог соединиться с целевым сервисом.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '504':
          description: Gateway не дождался ответа целевого сервиса до истечения тайм-аута.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
      security:
      - BearerAuth: []
    put:
      tags:
      - Activity requests
      summary: Edit activity request
      description: The organizer updates a planned request. The new capacity must
        fit accepted and pending players and stay within the sport's limits.
      operationId: updateRequest
      parameters:
      - name: id
        in: path
        description: UUID of the request
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
