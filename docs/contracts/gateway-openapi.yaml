# Сгенерировано scripts/build_gateway_openapi.rb из снимков сервисов в репозитории.
# Черновик: совместимость /api/v1 Core и Auth с работающими сервисами не проверена.
---
openapi: 3.1.0
info:
  title: AthleteLink — шлюз API
  version: draft
  description: Черновой публичный HTTP-контракт, собранный из снимков OpenAPI Core,
    Auth и Game в репозитории и таблицы маршрутов Gateway. Gateway пересылает тела
    запросов и ответов целевых сервисов без преобразования. Core, Auth и Game предоставляют
    только пары метода и пути из таблицы маршрутов Gateway. Снимки Core и Auth сейчас
    расходятся с согласованными путями /api/v1; соответствие работающим сервисам не
    проверено. Для собственных ошибок Gateway нет обязательной схемы тела ответа.
servers:
- url: "/"
  description: Корень Gateway; источник развёртывания настраивается отдельно.
paths:
  "/api/v1/requests/{id}":
    get:
      tags:
      - Заявки на игры
      summary: Получить подробности заявки
      description: Возвращает заявку, текущее состояние регистрации и список участников.
      operationId: getRequestDetails
      parameters:
      - name: id
        in: path
        description: UUID заявки
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Подробности заявки успешно получены
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ActivityRequestDetailsDto"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '400':
          description: Некорректный UUID заявки
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '404':
          description: Заявка не найдена
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '401':
          description: Gateway отклонил запрос из-за отсутствующего или недействительного
            токена доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '503':
          description: Gateway не смог завершить проверку списка отозванных токенов
            доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '502':
          description: Gateway не смог соединиться с целевым сервисом.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '504':
          description: Gateway не дождался ответа целевого сервиса до истечения тайм-аута.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
      security:
      - BearerAuth: []
    put:
      tags:
      - Заявки на игры
      summary: Изменить заявку на игру
      description: Организатор изменяет запланированную заявку. Новая вместимость
        должна учитывать текущих участников и оставаться в пределах ограничений вида
        спорта.
      operationId: updateRequest
      parameters:
      - name: id
        in: path
        description: UUID заявки
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Core_UpdateActivityRequestDto"
        required: true
      responses:
        '200':
          description: Обновлённые подробности заявки
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ActivityRequestDetailsDto"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '400':
          description: Некорректные данные заявки или вместимость вне ограничений
            вида спорта
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '403':
          description: Вызывающий пользователь не является организатором
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '404':
          description: Заявка не найдена
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '409':
          description: Заявка не запланирована или вместимость меньше числа присоединившихся
            игроков
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '401':
          description: Gateway отклонил запрос из-за отсутствующего или недействительного
            токена доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '503':
          description: Gateway не смог завершить проверку списка отозванных токенов
            доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '502':
          description: Gateway не смог соединиться с целевым сервисом.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '504':
          description: Gateway не дождался ответа целевого сервиса до истечения тайм-аута.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
      security:
      - BearerAuth: []
  "/api/v1/requests":
    get:
      tags:
      - Заявки на игры
      summary: Поиск заявок по местоположению
      description: Возвращает будущие запланированные заявки с открытой регистрацией
        в радиусе поиска, упорядоченные по расстоянию. Фильтры вида спорта и даты
        необязательны.
      operationId: searchNearbyRequests
      parameters:
      - name: lat
        in: query
        description: Широта
        required: true
        schema:
          type: number
          format: double
          maximum: 90.0
          minimum: -90.0
        example: 55.7558
      - name: lon
        in: query
        description: Долгота
        required: true
        schema:
          type: number
          format: double
          maximum: 180.0
          minimum: -180.0
        example: 37.6173
      - name: radius
        in: query
        description: Радиус поиска в метрах
        required: false
        schema:
          type: number
          format: double
          default: 5000.0
          exclusiveMinimum: 0
        example: 5000
      - name: sportId
        in: query
        description: Фильтр по виду спорта (необязательный)
        required: false
        schema:
          type: integer
          format: int64
        example: 1
      - name: startDate
        in: query
        description: Начало временного интервала (ISO-8601)
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-09-10 10:00:00.000000000 Z
      - name: endDate
        in: query
        description: Конец временного интервала (ISO-8601)
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-09-12 22:00:00.000000000 Z
      responses:
        '200':
          description: Заявки поблизости; список может быть пустым
          content:
            "*/*":
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Core_ActivityRequestFeedDto"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '400':
          description: Некорректные координаты, радиус или диапазон дат
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '401':
          description: Gateway отклонил запрос из-за отсутствующего или недействительного
            токена доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '503':
          description: Gateway не смог завершить проверку списка отозванных токенов
            доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '502':
          description: Gateway не смог соединиться с целевым сервисом.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '504':
          description: Gateway не дождался ответа целевого сервиса до истечения тайм-аута.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
      security:
      - BearerAuth: []
    post:
      tags:
      - Заявки на игры
      summary: Создать заявку на игру
      description: Создаёт запланированную заявку и добавляет её организатора первым
        принятым участником. Лимит игроков должен быть в пределах ограничений выбранного
        вида спорта.
      operationId: createRequest
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Core_CreateActivityRequestDto"
        required: true
      responses:
        '201':
          description: Заявка создана; ответ содержит requestId
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
                  format: uuid
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '400':
          description: Некорректные данные заявки или лимит игроков
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '404':
          description: Вид спорта не найден
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '401':
          description: Gateway отклонил запрос из-за отсутствующего или недействительного
            токена доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '503':
          description: Gateway не смог завершить проверку списка отозванных токенов
            доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '502':
          description: Gateway не смог соединиться с целевым сервисом.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '504':
          description: Gateway не дождался ответа целевого сервиса до истечения тайм-аута.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
      security:
      - BearerAuth: []
  "/api/v1/requests/{requestId}/rounds/{roundNumber}/result":
    post:
      tags:
      - Результаты раундов
      summary: Записать результат раунда
      description: Организатор записывает непустые группы победителей и проигравших
        одинакового размера из принятых участников. Результат раунда неизменяем и
        может быть записан только пока заявка активна. Core Service не рассчитывает
        рейтинг.
      operationId: recordRoundResult
      parameters:
      - name: requestId
        in: path
        description: UUID заявки
        required: true
        schema:
          type: string
          format: uuid
      - name: roundNumber
        in: path
        description: Номер раунда, начиная с 1
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Core_RecordRoundResultRequestDto"
        required: true
      responses:
        '201':
          description: Результат раунда записан
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_RoundResultResponseDto"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '400':
          description: Некорректный номер раунда или выбор игроков
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '403':
          description: Вызывающий пользователь не является организатором
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '404':
          description: Заявка не найдена
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '409':
          description: Заявка не активна или результат этого раунда уже есть
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '401':
          description: Gateway отклонил запрос из-за отсутствующего или недействительного
            токена доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '503':
          description: Gateway не смог завершить проверку списка отозванных токенов
            доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '502':
          description: Gateway не смог соединиться с целевым сервисом.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '504':
          description: Gateway не дождался ответа целевого сервиса до истечения тайм-аута.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
      security:
      - BearerAuth: []
  "/api/v1/requests/{requestId}/complete":
    post:
      tags:
      - Результаты раундов
      summary: Завершить заявку
      description: Организатор завершает активную заявку после записи результатов
        всех запланированных раундов.
      operationId: completeRequest
      parameters:
      - name: requestId
        in: path
        description: UUID заявки
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Заявка завершена
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '400':
          description: Некорректный UUID заявки или вызывающего пользователя
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '403':
          description: Вызывающий пользователь не является организатором
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '404':
          description: Заявка не найдена
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '409':
          description: Заявка не активна или для некоторых раундов нет результата
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '401':
          description: Gateway отклонил запрос из-за отсутствующего или недействительного
            токена доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '503':
          description: Gateway не смог завершить проверку списка отозванных токенов
            доступа.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '502':
          description: Gateway не смог соединиться с целевым сервисом.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '504':
          description: Gateway не дождался ответа целевого сервиса до истечения тайм-аута.
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
      security:
      - BearerAuth: []
  "/api/v1/requests/{id}/start":
    post:
      tags:
      - Заявки на игры
      summary: Запустить заявку
      description: Организатор запускает запланированную заявку после присоединения
        минимального для вида спорта числа игроков. Регистрация закрывается автоматически.
      operationId: startRequest
      parameters:
      - name: id
        in: path
        description: UUID заявки
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Заявка запущена
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '400':
          description: Некорректный UUID заявки или вызывающего пользователя
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '403':
          description: Вызывающий пользователь не является организатором
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '404':
          description: Заявка не найдена
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '409':
          description: Заявка не запланирована или игроков слишком мало
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
