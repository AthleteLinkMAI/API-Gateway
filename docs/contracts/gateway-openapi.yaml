  "/api/v1/requests/{requestId}/complete":
    post:
      tags:
      - Round submissions and completion
      summary: Request asynchronous completion
      description: Core moves the request to CONFIRMATION and queues a Game Service
        check. Poll GET /requests/{requestId} for COMPLETED or ACTIVE with completionErrorMessage.
        A repeated call while pending does not queue another command.
      operationId: completeRequest
      parameters:
      - name: requestId
        in: path
        description: Request UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Completion check queued
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_CompletionAcceptedDto"
          headers:
            X-Request-Id:
