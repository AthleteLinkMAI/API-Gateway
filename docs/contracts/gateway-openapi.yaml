  "/api/v1/requests/{requestId}/join-requests/{participantId}/decision":
    post:
      tags:
      - Join requests
      summary: Approve or reject a join request
      description: Only the organizer may decide a pending application while the activity
        request is PLANNED. Approval changes the player to ACCEPTED immediately and
        sets joinedAt. Rejection deletes the pending record. A later application by
        the same user has a different participantId. The decision is committed in
        Request Service; no Game Service message is used. Closing registration blocks
        new applications but does not block decisions on existing ones.
      operationId: decideJoinRequest
      parameters:
      - name: requestId
        in: path
        description: Activity request UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: participantId
        in: path
        description: ID of the pending participant record returned by the list endpoint
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Core_JoinDecisionRequestDto"
        required: true
      responses:
        '204':
          description: Decision applied; no response body
          headers:
            X-Request-Id:
              description: UUID, сгенерированный Gateway для этого запроса.
              schema:
                type: string
                format: uuid
        '400':
          description: Missing or malformed UUID or accepted flag
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/Core_ApiError"
          headers:
            X-Request-Id:
