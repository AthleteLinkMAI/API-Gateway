openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8084/api/v1
  description: Generated server url
tags:
- name: Player profiles
  description: API for viewing player profiles and match history
paths:
  /results/by-request/{activityRequestId}:
    get:
      tags:
      - Results
      summary: Get all round results for an activity request in round-number order
      operationId: getByActivityRequest
      parameters:
      - name: activityRequestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Round results retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoundResultDetailsDto"
        "404":
          description: No round results found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoundResultDetailsDto"
  /rank-tiers:
    get:
      tags:
      - Rank tiers
      summary: Get configured rank thresholds
      operationId: getRankTiers
      responses:
        "200":
          description: Rank thresholds retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankTierDto"
  /players/{userId}:
    get:
      tags:
      - Player profiles
      summary: Get player summary
      operationId: getSummary
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Summary retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerSummaryDto"
        "404":
          description: Player profile not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerSummaryDto"
  /players/{userId}/sports/{sportId}:
    get:
      tags:
      - Player profiles
      summary: Get player statistics for one sport
      operationId: getSportDetails
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sportId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Sport statistics retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerSportDetailsDto"
        "404":
          description: Player or sport statistics not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerSportDetailsDto"
  /players/{userId}/other-sports:
    get:
      tags:
      - Player profiles
      summary: Get all player sports except the highest-scoring one
      operationId: getOtherSports
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Other sports retrieved, possibly empty"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OtherSportDto"
        "404":
          description: Player profile not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OtherSportDto"
  /players/{userId}/matches/{page}/{cntPerPage}:
    get:
      tags:
      - Player profiles
      summary: Get player round history by page number
      operationId: getMatches
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sportId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: cntPerPage
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Match history retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerRoundHistoryDto"
        "400":
          description: "Invalid sport ID, page or count per page"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerRoundHistoryDto"
        "404":
          description: Player profile not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerRoundHistoryDto"
  /players/{userId}/last-game:
    get:
      tags:
      - Player profiles
      summary: Get the most recently recorded round played by the user
      operationId: getLastGame
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Last round retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LastGameDto"
        "204":
          description: Player has no recorded rounds
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LastGameDto"
        "404":
          description: Player profile not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LastGameDto"
  /players/{userId}/best-sport:
    get:
      tags:
      - Player profiles
      summary: Get the player's highest-scoring sport
      operationId: getBestSport
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Best sport retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BestSportDto"
        "204":
          description: Player has no sport statistics
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BestSportDto"
        "404":
          description: Player profile not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BestSportDto"
  /leaderboards/{sportId}/{page}/{cntPerPage}:
    get:
      tags:
      - Leaderboards
      summary: Get sport leaderboard
      operationId: getLeaderboard
      parameters:
      - name: sportId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: cntPerPage
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Leaderboard retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntryDto"
        "400":
          description: "Invalid sport ID, page or count per page"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntryDto"
components:
  schemas:
    PlayerResultDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        outcome:
          type: string
          enum:
          - WIN
          - LOSS
          - DRAW
        ratingChange:
          type: integer
          format: int32
    RoundResultDetailsDto:
      type: object
      description: Result of one round in an activity request
      properties:
        id:
          type: string
          format: uuid
        activityRequestId:
          type: string
          format: uuid
        roundNumber:
          type: integer
          format: int32
        sportId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - DISPUTED
        createdAt:
          type: string
          format: date-time
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerResultDto"
    RankTierDto:
      type: object
      description: Configured score threshold for a rank tier
      properties:
        name:
          type: string
          description: Rank name
          example: GOLD
        tier:
          type: integer
          format: int32
          description: Tier number from 1 to 3
          example: 1
        scoreMin:
          type: integer
          format: int32
          description: Minimum score included in this rank
          example: 1200
        scoreMax:
          type: integer
          format: int32
          description: Maximum score included in this rank
          example: 1399
    PlayerSummaryDto:
      type: object
      description: Aggregated player statistics
      properties:
        userId:
          type: string
          format: uuid
          description: User ID
          example: 123e4567-e89b-12d3-a456-426614174000
        summary:
          $ref: "#/components/schemas/Summary"
          description: Aggregated statistics across all sports
    Summary:
      type: object
      properties:
        sportsPlayed:
          type: integer
          format: int64
          description: Number of sports played
          example: 2
        roundsPlayed:
          type: integer
          format: int32
          description: Total number of rounds
          example: 12
        wins:
          type: integer
          format: int32
          description: Total wins
          example: 7
        losses:
          type: integer
          format: int32
          description: Total losses
          example: 4
        draws:
          type: integer
          format: int32
          description: Total draws
          example: 1
    PlayerSportDetailsDto:
      type: object
      description: Player statistics for one sport
      properties:
        userId:
          type: string
          format: uuid
          description: User ID
        sportId:
          type: integer
          format: int64
          description: Sport ID
          example: 1
        roundsPlayed:
          type: integer
          format: int32
          description: Rounds played in this sport
          example: 8
        wins:
          type: integer
          format: int32
          description: Wins in this sport
          example: 5
        losses:
          type: integer
          format: int32
          description: Losses in this sport
          example: 2
        draws:
          type: integer
          format: int32
          description: Draws in this sport
          example: 1
        score:
          type: integer
          format: int32
          description: Current score
          example: 1200
        leaderboardPlace:
          type: integer
          format: int64
          description: Current leaderboard place
          example: 7
        rank:
          $ref: "#/components/schemas/RankDto"
          description: Rank calculated from score
    RankDto:
      type: object
      description: Player rank calculated from score
      properties:
        name:
          type: string
          description: Rank name
          example: GOLD
        tier:
          type: integer
          format: int32
          description: Rank tier
          example: 1
        scoreMin:
          type: integer
          format: int32
          description: Minimum score
          example: 1200
        scoreMax:
          type: integer
          format: int32
          description: Maximum score
          example: 1399
    OtherSportDto:
      type: object
      description: Statistics for a sport other than the player's highest-scoring
        sport
      properties:
        sportId:
          type: integer
          format: int64
        score:
          type: integer
          format: int32
        nextRankScore:
          type: integer
          format: int32
          description: Score required for the next rank; null at the highest rank
        rank:
          $ref: "#/components/schemas/RankDto"
    PlayerRoundHistoryDto:
      type: object
      description: One round in a player's history
      properties:
        roundResultId:
          type: string
          format: uuid
        activityRequestId:
          type: string
          format: uuid
        roundNumber:
          type: integer
          format: int32
        sportId:
          type: integer
          format: int64
        outcome:
          type: string
          enum:
          - WIN
          - LOSS
          - DRAW
        ratingChange:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    LastGameDto:
      type: object
      description: The most recently recorded round played by a user
      properties:
        roundResultId:
          type: string
          format: uuid
        activityRequestId:
          type: string
          format: uuid
        roundNumber:
          type: integer
          format: int32
        sportId:
          type: integer
          format: int64
        outcome:
          type: string
          enum:
          - WIN
          - LOSS
          - DRAW
        createdAt:
          type: string
          format: date-time
          description: "Time the result was recorded, not the date the game was played"
        playerIds:
          type: array
          description: "User IDs of all participants in this round, including the\
            \ requested player"
          items:
            type: string
            format: uuid
    BestSportDto:
      type: object
      description: Player's highest-scoring sport
      properties:
        sportId:
          type: integer
          format: int64
        score:
          type: integer
          format: int32
        nextRankScore:
          type: integer
          format: int32
          description: Score required for the next rank; null at the highest rank
        leaderboardPlace:
          type: integer
          format: int64
          description: Place among players of this sport; equal scores share a place
        wins:
          type: integer
          format: int32
        winRatePercent:
          type: number
          format: double
          description: "Wins divided by all rounds in this sport, as a percentage"
        rank:
          $ref: "#/components/schemas/RankDto"
    LeaderboardEntryDto:
      type: object
      properties:
        place:
          type: integer
          format: int64
        userId:
          type: string
          format: uuid
        score:
          type: integer
          format: int32
        wins:
          type: integer
          format: int32
        losses:
          type: integer
          format: int32
        draws:
          type: integer
          format: int32
        rank:
          $ref: "#/components/schemas/Rank"
    Rank:
      type: object
      properties:
        name:
          type: string
        scoreMin:
          type: integer
          format: int32
        scoreMax:
          type: integer
          format: int32
