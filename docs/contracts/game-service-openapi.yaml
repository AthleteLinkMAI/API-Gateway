openapi: 3.0.1
info:
  title: "Определение OpenAPI"
  version: v0
servers:
- url: http://localhost:8082/api/v1
  description: "Сгенерированный URL сервера"
tags:
- name: "Профили игроков"
  description: "API для просмотра профилей игроков и истории матчей"
paths:
  /results/by-request/{activityRequestId}:
    get:
      tags:
      - "Результаты"
      summary: "Получить результат по заявке на игру"
      operationId: getByActivityRequest
      parameters:
      - name: activityRequestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Результат игры успешно получен"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GameResultDetailsDto"
        "404":
          description: "Результат игры не найден"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GameResultDetailsDto"
  /rank-tiers:
    get:
      tags:
      - "Ступени рангов"
      summary: "Получить настроенные пороги рангов"
      operationId: getRankTiers
      responses:
        "200":
          description: "Пороги рангов успешно получены"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankTierDto"
  /players/{userId}:
    get:
      tags:
      - "Профили игроков"
      summary: "Получить сводку игрока"
      operationId: getSummary
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Сводка успешно получена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerSummaryDto"
        "404":
          description: "Профиль игрока не найден"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerSummaryDto"
  /players/{userId}/sports/{sportId}:
    get:
      tags:
      - "Профили игроков"
      summary: "Получить статистику игрока по одному виду спорта"
      operationId: getSportDetails
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sportId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: "Статистика по виду спорта успешно получена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerSportDetailsDto"
        "404":
          description: "Игрок, вид спорта или статистика не найдены"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlayerSportDetailsDto"
  /players/{userId}/matches:
    get:
      tags:
      - "Профили игроков"
      summary: "Получить историю матчей игрока с пагинацией"
      operationId: getMatches
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sportId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "404":
          description: "Профиль игрока или вид спорта не найдены"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CursorPageDtoPlayerGameHistoryDto"
        "200":
          description: "История матчей успешно получена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CursorPageDtoPlayerGameHistoryDto"
        "400":
          description: "Некорректный курсор или лимит"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CursorPageDtoPlayerGameHistoryDto"
  /leaderboards/{sportId}:
    get:
      tags:
      - "Таблицы лидеров"
      summary: "Получить таблицу лидеров по виду спорта"
      operationId: getLeaderboard
      parameters:
      - name: sportId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: "Таблица лидеров успешно получена"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CursorPageDtoLeaderboardEntryDto"
        "400":
          description: "Некорректный курсор или лимит"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CursorPageDtoLeaderboardEntryDto"
        "404":
          description: "Вид спорта не найден"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CursorPageDtoLeaderboardEntryDto"
components:
  schemas:
    GameResultDetailsDto:
      type: object
      properties:
        id:
          type: string
          description: "Уникальный ID результата игры"
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        activityRequestId:
          type: string
          description: "ID соответствующей заявки на игру"
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        sportId:
          type: integer
          description: "ID вида спорта"
          format: int64
          example: 1
        status:
          type: string
          description: "Текущий статус результата игры"
          enum:
          - PENDING
          - CONFIRMED
          - DISPUTED
        createdAt:
          type: string
          description: "Время обработки результата"
          format: date-time
          example: 2026-09-04T18:00:00Z
        players:
          type: array
          description: "Результаты отдельных игроков"
          items:
            $ref: "#/components/schemas/PlayerResultDto"
      description: "Подробные сведения о результате игры"
    PlayerResultDto:
      type: object
      properties:
        userId:
          type: string
          description: "ID пользователя"
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        outcome:
          type: string
          description: "Исход матча для этого игрока"
          enum:
          - WIN
          - LOSS
          - DRAW
        ratingChange:
          type: integer
          description: "Изменение рейтинга после этого матча"
          format: int32
      description: "Результат отдельного игрока в игре"
    RankTierDto:
      type: object
      properties:
        name:
          type: string
          description: "Название ранга"
          example: GOLD
        tier:
          type: integer
          description: "Номер ступени от 1 до 3"
          format: int32
          example: 1
        scoreMin:
          type: integer
          description: "Минимальное число очков этого ранга"
          format: int32
          example: 1200
        scoreMax:
          type: integer
          description: "Максимальное число очков этого ранга"
          format: int32
          example: 1399
      description: "Настроенный порог очков ступени ранга"
    PlayerSummaryDto:
      type: object
      properties:
        userId:
          type: string
          description: "ID пользователя"
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        summary:
          $ref: "#/components/schemas/Summary"
      description: "Сводная статистика игрока"
    Summary:
      type: object
      properties:
        sportsPlayed:
          type: integer
          description: "Число видов спорта, в которые играл пользователь"
          format: int64
          example: 2
        gamesPlayed:
          type: integer
          description: "Общее число игр"
          format: int32
          example: 12
        wins:
          type: integer
          description: "Всего побед"
          format: int32
          example: 7
        losses:
          type: integer
          description: "Всего поражений"
          format: int32
          example: 4
        draws:
          type: integer
          description: "Всего ничьих"
          format: int32
          example: 1
      description: "Сводная статистика по всем видам спорта"
    PlayerSportDetailsDto:
      type: object
      properties:
        userId:
          type: string
          description: "ID пользователя"
          format: uuid
        sportId:
          type: integer
          description: "ID вида спорта"
          format: int64
          example: 1
        sportName:
          type: string
          description: "Название вида спорта"
          example: Football
        gamesPlayed:
          type: integer
          description: "Число игр по этому виду спорта"
          format: int32
          example: 8
        wins:
          type: integer
          description: "Победы по этому виду спорта"
          format: int32
          example: 5
        losses:
          type: integer
          description: "Поражения по этому виду спорта"
          format: int32
          example: 2
        draws:
          type: integer
          description: "Ничьи по этому виду спорта"
          format: int32
          example: 1
        score:
          type: integer
          description: "Текущее число очков"
          format: int32
          example: 1200
        leaderboardPlace:
          type: integer
          description: "Текущее место в таблице лидеров"
          format: int64
          example: 7
        rank:
          $ref: "#/components/schemas/RankDto"
      description: "Статистика игрока по одному виду спорта"
    RankDto:
      type: object
      properties:
        name:
          type: string
          description: "Название ранга"
          example: GOLD
        tier:
          type: integer
          description: "Ступень ранга"
          format: int32
          example: 1
        scoreMin:
          type: integer
          description: "Минимальное число очков"
          format: int32
          example: 1200
        scoreMax:
          type: integer
          description: "Максимальное число очков"
          format: int32
          example: 1399
      description: "Ранг игрока, рассчитанный по очкам"
    CursorPageDtoPlayerGameHistoryDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlayerGameHistoryDto"
        nextCursor:
          type: string
        hasNext:
          type: boolean
    PlayerGameHistoryDto:
      type: object
      properties:
        gameResultId:
          type: string
          description: "ID результата игры"
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        sportId:
          type: integer
          description: "ID вида спорта"
          format: int64
          example: 1
        outcome:
          type: string
          description: "Исход для этого игрока"
          enum:
          - WIN
          - LOSS
          - DRAW
        ratingChange:
          type: integer
          description: "Изменение рейтинга после этого матча"
          format: int32
        createdAt:
          type: string
          description: "Время обработки результата"
          format: date-time
          example: 2026-09-04T18:00:00Z
      description: "Одна запись истории матчей игрока"
    CursorPageDtoLeaderboardEntryDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntryDto"
        nextCursor:
          type: string
        hasNext:
          type: boolean
    LeaderboardEntryDto:
      type: object
      properties:
        place:
          type: integer
          format: int64
        userId:
          type: string
          format: uuid
        score:
          type: integer
          format: int32
        wins:
          type: integer
          format: int32
        losses:
          type: integer
          format: int32
        draws:
          type: integer
          format: int32
        rank:
          $ref: "#/components/schemas/RankDto"
