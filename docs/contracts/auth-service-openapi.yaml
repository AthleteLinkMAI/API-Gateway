openapi: 3.1.0
info:
  title: AtheleteLink Auth Service
  description: "Authentication, verification, session and user management"
  license:
    name: MIT License
  version: 1.0.0
servers:
- url: http://localhost:8081/api/v1
  description: Generated server url
paths:
  /user/update-user/{userId}:
    put:
      tags:
      - user-controller
      operationId: updateUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateControllerDto"
        required: true
      responses:
        "200":
          description: OK
  /user/change-password/{userId}:
    put:
      tags:
      - user-controller
      operationId: changePassword
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequestControllerDto"
        required: true
      responses:
        "200":
          description: OK
  /user/change-email/{userId}:
    put:
      tags:
      - user-controller
      operationId: changeEmail
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: email
        required: true
      responses:
        "200":
          description: OK
  /verification/verify-password-reset:
    post:
      tags:
      - verification-controller
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestControllerDto"
        required: true
      responses:
        "200":
          description: OK
  /verification/verify-email/{userId}:
    post:
      tags:
      - verification-controller
      operationId: verifyEmail
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: boolean
  /verification/send-password-reset-code:
    post:
      tags:
      - verification-controller
      operationId: sendPasswordResetCode
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: email
        required: true
      responses:
        "200":
          description: OK
  /verification/send-email-verification-code/{userId}:
    post:
      tags:
      - verification-controller
      operationId: sendEmailVerificationCode
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /user/register:
    post:
      tags:
      - user-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestControllerDto"
        required: true
      responses:
        "200":
          description: OK
  /auth/refresh:
    post:
      tags:
      - authentication-controller
      operationId: refresh
      parameters:
      - name: jwtRefreshToken
        in: cookie
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /auth/login:
    post:
      tags:
      - authentication-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsControllerDto"
        required: true
      responses:
        "200":
          description: OK
  /user:
    get:
      tags:
      - user-controller
      operationId: getUsersByUserIds
      parameters:
      - name: userIds
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPublicControllerDto"
  /user/me/{userId}:
    get:
      tags:
      - user-controller
      operationId: me
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserControllerDto"
  /session/get-all/{userId}:
    get:
      tags:
      - session-controller
      operationId: getAllSessions
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionControllerDto"
  /health:
    get:
      tags:
      - health-controller
      operationId: getHealth
      responses:
        "200":
          description: OK
  /user/delete/{userId}:
    delete:
      tags:
      - user-controller
      operationId: deleteUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /session/terminate/{userId}:
    delete:
      tags:
      - session-controller
      operationId: terminateSession
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: uuid
        required: true
      responses:
        "200":
          description: OK
  /session/terminate-all/{userId}:
    delete:
      tags:
      - session-controller
      operationId: terminateAllSessions
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /auth/logout:
    delete:
      tags:
      - authentication-controller
      operationId: logout
      parameters:
      - name: jwtRefreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
components:
  schemas:
    UserUpdateControllerDto:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 30
          minLength: 0
        name:
          type: string
          maxLength: 30
          minLength: 0
        surname:
          type: string
          maxLength: 30
          minLength: 0
        birthdate:
          type: string
          format: date
      required:
      - birthdate
      - nickname
    ChangePasswordRequestControllerDto:
      type: object
      properties:
        oldPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 2147483647
          minLength: 8
      required:
      - newPassword
      - oldPassword
    PasswordResetRequestControllerDto:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - code
      - email
    RegisterRequestControllerDto:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 30
          minLength: 3
        name:
          type: string
          maxLength: 30
          minLength: 0
        surname:
          type: string
          maxLength: 30
          minLength: 0
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
        birthdate:
          type: string
          format: date
      required:
      - birthdate
      - email
      - nickname
      - password
    CredentialsControllerDto:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    UserPublicControllerDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        name:
          type: string
        surname:
          type: string
        age:
          type: integer
          format: int32
        registrationDate:
          type: string
          format: date
    UserControllerDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        name:
          type: string
        surname:
          type: string
        email:
          type: string
        isVerified:
          type: boolean
        age:
          type: integer
          format: int32
        registrationDate:
          type: string
          format: date
    SessionControllerDto:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        expiration:
          type: string
          format: date-time
        lastUsed:
          type: string
          format: date-time
        userAgent:
          type: string
        ipAddress:
          type: string
