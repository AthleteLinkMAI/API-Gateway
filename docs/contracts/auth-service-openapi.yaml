openapi: 3.1.0
info:
  title: AtheleteLink Auth Service
  description: "Authentication, verification, session and user management"
  license:
    name: MIT License
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Generated server url
paths:
  /user/role:
    put:
      tags:
      - user-credentials-controller
      operationId: updateUserRole
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Role
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMIN
          - MODERATOR
          - USER
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequestControllerDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCredentialsControllerDto"
  /user/password:
    put:
      tags:
      - user-credentials-controller
      operationId: changePassword
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequestControllerDto"
        required: true
      responses:
        "200":
          description: OK
  /user/email:
    put:
      tags:
      - user-credentials-controller
      operationId: changeEmail
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: email
        required: true
      responses:
        "200":
          description: OK
  /verification/send-password-reset-code:
    post:
      tags:
      - verification-controller
      operationId: sendPasswordResetCode
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: email
        required: true
      responses:
        "200":
          description: OK
  /verification/send-email-verification-code:
    post:
      tags:
      - verification-controller
      operationId: sendEmailVerificationCode
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Accepted
  /verification/password-reset:
    post:
      tags:
      - verification-controller
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestControllerDto"
        required: true
      responses:
        "200":
          description: OK
  /verification/email:
    post:
      tags:
      - verification-controller
      operationId: verifyEmail
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: OK
  /user:
    post:
      tags:
      - user-credentials-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestControllerDto"
        required: true
      responses:
        "201":
          description: Created
    delete:
      tags:
      - user-credentials-controller
      operationId: deleteUser
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /ban:
    post:
      tags:
      - ban-controller
      operationId: banUser
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Role
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMIN
          - MODERATOR
          - USER
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanToCreateControllerDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BanControllerDto"
    delete:
      tags:
      - ban-controller
      operationId: unbanUser
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Role
        in: header
        required: true
        schema:
          type: string
          enum:
          - ADMIN
          - MODERATOR
          - USER
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: uuid
        required: true
      responses:
        "200":
          description: OK
  /auth/refresh:
    post:
      tags:
      - authentication-controller
      operationId: refresh
      parameters:
      - name: jwtRefreshToken
        in: cookie
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /auth/login:
    post:
      tags:
      - authentication-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsControllerDto"
        required: true
      responses:
        "200":
          description: OK
  /session:
    get:
      tags:
      - session-controller
      operationId: getAllSessions
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionControllerDto"
    delete:
      tags:
      - session-controller
      operationId: terminateSession
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: uuid
        required: true
      responses:
        "204":
          description: No Content
  /health:
    get:
      tags:
      - health-controller
      operationId: getHealth
      responses:
        "200":
          description: OK
  /ban/{email}:
    get:
      tags:
      - ban-controller
      operationId: getBanByUserEmail
      parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
          format: email
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BanControllerDto"
  /session/all:
    delete:
      tags:
      - session-controller
      operationId: terminateAllSessions
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /auth/logout:
    delete:
      tags:
      - authentication-controller
      operationId: logout
      parameters:
      - name: jwtRefreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
components:
  schemas:
    UpdateRoleRequestControllerDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        newRole:
          type: string
          enum:
          - ADMIN
          - MODERATOR
          - USER
    UserCredentialsControllerDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - ADMIN
          - MODERATOR
          - USER
        email:
          type: string
        isVerified:
          type: boolean
        isBanned:
          type: boolean
    ChangePasswordRequestControllerDto:
      type: object
      properties:
        oldPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 2147483647
          minLength: 8
      required:
      - newPassword
      - oldPassword
    PasswordResetRequestControllerDto:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - code
      - email
    RegisterRequestControllerDto:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 30
          minLength: 3
        name:
          type: string
          maxLength: 30
          minLength: 0
        surname:
          type: string
          maxLength: 30
          minLength: 0
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
        birthdate:
          type: string
          format: date
      required:
      - birthdate
      - email
      - nickname
      - password
    BanToCreateControllerDto:
      type: object
      properties:
        userToBan:
          type: string
          format: uuid
        reason:
          type: string
        expiration:
          type: string
          format: date-time
    BanControllerDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        expiration:
          type: string
          format: date-time
        reason:
          type: string
        bannedBy:
          type: string
          format: uuid
    CredentialsControllerDto:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    SessionControllerDto:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        expiration:
          type: string
          format: date-time
        lastUsed:
          type: string
          format: date-time
        userAgent:
          type: string
        ipAddress:
          type: string
